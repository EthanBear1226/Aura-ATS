<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>我的面试 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=19">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .page-content { max-width: 1240px; margin: 0 auto; }
        .workbench-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
        .workbench-heading h1 { margin: 0; font-size: 28px; }
        .workbench-heading p { margin: 8px 0 0; color: var(--text-secondary); font-size: 14px; }
        .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
        .summary-card { padding: 18px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; }
        .summary-label { color: var(--text-secondary); font-size: 13px; }
        .summary-value { margin-top: 8px; font-size: 28px; font-weight: 700; }
        .section { margin-top: 24px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .section-header h2 { margin: 0; font-size: 17px; }
        .section-header span { color: var(--text-secondary); font-size: 13px; }
        .interview-list { display: grid; gap: 10px; }
        .interview-card { display: grid; grid-template-columns: minmax(180px, 1.2fr) minmax(190px, 1fr) minmax(170px, .9fr) auto; align-items: center; gap: 18px; padding: 18px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); }
        .interview-card:hover { border-color: var(--primary-color); box-shadow: var(--shadow-sm); }
        .eyebrow { color: var(--text-secondary); font-size: 12px; margin-bottom: 5px; }
        .candidate-name { font-size: 15px; font-weight: 650; }
        .interview-meta { color: var(--text-primary); font-size: 14px; line-height: 1.6; }
        .status { display: inline-flex; align-items: center; width: fit-content; padding: 4px 9px; border-radius: 999px; background: #eef6ff; color: var(--primary-color); font-size: 12px; }
        .status.overdue { background: #fff1f0; color: #d4380d; }
        .status.done { background: #eff9f1; color: #18794e; }
        .empty-state { padding: 28px; text-align: center; color: var(--text-secondary); border: 1px dashed var(--border-color); border-radius: 8px; background: rgba(255,255,255,.55); }
        .loading { color: var(--text-secondary); padding: 40px; text-align: center; }
        .workbench-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:20px 0 12px; }
        .filter-tabs { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--border-color); padding-bottom:8px; }
        .filter-tab { background:transparent; border:0; color:var(--text-secondary); font:inherit; font-size:14px; padding:9px 12px; cursor:pointer; border-radius:6px; }
        .filter-tab[aria-pressed="true"] { background:#eef6ff; color:var(--primary-color); font-weight:600; }
        .search-field { flex:1; min-width:180px; }
        .search-field input { width:100%; min-height:38px; }
        .workbench-toolbar select { min-height:38px; width:156px; max-width:100%; }
        .icon-button { width:38px; height:38px; padding:8px; justify-content:center; }
        .icon-button svg { width:18px; height:18px; }
        .icon-button i { font-style:normal; font-size:22px; line-height:1; }
        .interview-card > div { min-width:0; overflow-wrap:anywhere; }
        .status.closed { background:#f3f4f6; color:var(--text-secondary); }
        .list-meta { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--text-secondary); font-size:13px; margin-bottom:12px; }
        .reminder-panel { margin: 0 0 22px; padding: 16px 18px; border: 1px solid var(--border-color); border-left: 3px solid var(--primary-color); border-radius: 8px; background: var(--card-bg); }
        .reminder-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
        .reminder-heading h2 { margin:0; font-size:16px; }
        .reminder-count { color:var(--text-secondary); font-size:13px; }
        .reminder-list { display:grid; gap:8px; }
        .reminder-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--border-color); }
        .reminder-item:first-child { border-top:0; padding-top:0; }
        .reminder-copy { min-width:0; }
        .reminder-label { display:inline-flex; align-items:center; margin-right:8px; padding:3px 7px; border-radius:999px; font-size:12px; font-weight:600; background:#fff7e6; color:#ad6800; }
        .reminder-label.overdue { background:#fff1f0; color:#d4380d; }
        .reminder-label.late { background:#fff1f0; color:#a8071a; }
        .reminder-text { font-size:14px; overflow-wrap:anywhere; }
        .reminder-time { display:block; margin-top:3px; color:var(--text-secondary); font-size:12px; }
        .reminder-link { flex:none; }
        .reminder-empty { color:var(--text-secondary); font-size:13px; }
        [hidden] { display:none !important; }
        @media (max-width: 900px) {
            .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .interview-card { grid-template-columns: 1fr 1fr; }
            .interview-card .card-action { grid-column: 1 / -1; }
        }
        @media (max-width: 560px) {
            .search-field { flex-basis:100%; }
            .workbench-heading { display: block; }
            .summary-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .summary-card { padding: 14px; }
            .summary-value { font-size: 24px; }
            .interview-card { grid-template-columns: 1fr; gap: 10px; }
            .interview-card .card-action { grid-column: auto; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content">
                <div class="workbench-heading">
                    <div>
                        <h1>我的面试</h1>
                        <p id="workbench-subtitle">只展示分配给你的面试安排和待办反馈</p>
                    </div>
                    <a class="btn" href="interviews.html?v=19">查看面试日程</a>
                </div>

                <div class="summary-grid">
                    <div class="summary-card"><div class="summary-label">今日面试</div><div class="summary-value" id="todayCount">0</div></div>
                    <div class="summary-card"><div class="summary-label">待填写反馈</div><div class="summary-value" id="feedbackCount">0</div></div>
                    <div class="summary-card"><div class="summary-label">即将开始</div><div class="summary-value" id="upcomingCount">0</div></div>
                    <div class="summary-card"><div class="summary-label">已完成</div><div class="summary-value" id="completedCount">0</div></div>
                </div>

                <section class="reminder-panel" aria-labelledby="reminderTitle">
                    <div class="reminder-heading"><h2 id="reminderTitle">需要关注</h2><span class="reminder-count" id="reminderCount" aria-live="polite">0 项</span></div>
                    <div class="reminder-list" id="reminderList"><div class="reminder-empty">正在检查提醒...</div></div>
                </section>

                <section class="section" aria-label="面试列表">
                    <div class="filter-tabs" id="filterTabs" role="group" aria-label="筛选面试">
                        <button class="filter-tab" data-filter="all" aria-pressed="true">全部</button>
                        <button class="filter-tab" data-filter="today" aria-pressed="false">今日</button>
                        <button class="filter-tab" data-filter="feedback" aria-pressed="false">待反馈</button>
                        <button class="filter-tab" data-filter="upcoming" aria-pressed="false">即将开始</button>
                        <button class="filter-tab" data-filter="completed" aria-pressed="false">已完成</button>
                        <button class="filter-tab" data-filter="closed" aria-pressed="false">已取消 / 中止</button>
                    </div>
                    <div class="workbench-toolbar">
                        <label class="search-field"><input class="form-control" id="interviewSearch" type="search" placeholder="搜索候选人或职位" aria-label="搜索候选人或职位"></label>
                        <select class="form-control" id="interviewSort" aria-label="面试排序">
                            <option value="asc">时间从早到晚</option>
                            <option value="desc">时间从晚到早</option>
                        </select>
                        <button class="btn icon-button" id="refreshInterviews" type="button" title="刷新面试" aria-label="刷新面试"><i data-lucide="refresh-cw" aria-hidden="true">↻</i></button>
                        <button class="btn" id="clearFilters" type="button" hidden>清除筛选</button>
                    </div>
                    <div class="list-meta"><span id="resultCount" role="status" aria-live="polite">正在加载...</span><span id="updatedAt"></span></div>
                    <div class="interview-list" id="interviewList"><div class="loading">正在加载面试安排...</div></div>
                    <button class="btn" id="retryLoad" type="button" hidden>重试</button>
                </section>
            </div>
        </main>
    </div>
    <script src="assets/js/app.js?v=19"></script>
    <script>
        let myInterviews = [];
        let loaded = false;
        let loading = false;
        const params = new URLSearchParams(window.location.search);
        let activeFilter = ['all', 'today', 'feedback', 'upcoming', 'completed', 'closed'].includes(params.get('filter')) ? params.get('filter') : 'all';

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            if (user.role !== 'Interviewer') {
                window.location.replace('index.html');
                return;
            }
            renderSidebar('interviewer-workbench');
            renderHeader();
            if (window.lucide) lucide.createIcons();
            document.getElementById('interviewSearch').value = params.get('q') || '';
            document.getElementById('interviewSort').value = params.get('sort') === 'desc' ? 'desc' : 'asc';
            document.querySelectorAll('.filter-tab').forEach(button => button.addEventListener('click', () => {
                activeFilter = button.dataset.filter;
                updateFilters();
            }));
            document.getElementById('interviewSearch').addEventListener('input', updateFilters);
            document.getElementById('interviewSort').addEventListener('change', updateFilters);
            document.getElementById('clearFilters').onclick = () => {
                activeFilter = 'all';
                document.getElementById('interviewSearch').value = '';
                document.getElementById('interviewSort').value = 'asc';
                updateFilters();
            };
            document.getElementById('refreshInterviews').onclick = loadInterviewerWorkbench;
            document.getElementById('retryLoad').onclick = loadInterviewerWorkbench;
            setInterval(() => { if (loaded) renderWorkbench(); }, 60000);
            loadInterviewerWorkbench();
        });

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[character]));
        }

        async function loadInterviewerWorkbench() {
            if (loading) return;
            loading = true;
            document.getElementById('refreshInterviews').disabled = true;
            document.getElementById('retryLoad').hidden = true;
            try {
                const response = await fetch('/api/interviewer/workbench');
                if (response.status === 403) {
                    window.location.replace('index.html');
                    return;
                }
                if (!response.ok) throw new Error('load failed');
                myInterviews = await response.json();
                loaded = true;
                document.getElementById('updatedAt').textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}`;
                renderWorkbench();
            } catch (error) {
                console.error(error);
                loaded = false;
                document.getElementById('interviewList').innerHTML = '<div class="empty-state">暂时无法加载面试安排。</div>';
                document.getElementById('resultCount').textContent = '加载失败';
                document.getElementById('updatedAt').textContent = '';
                ['todayCount', 'feedbackCount', 'upcomingCount', 'completedCount'].forEach(id => document.getElementById(id).textContent = '--');
                document.getElementById('retryLoad').hidden = false;
            } finally {
                loading = false;
                document.getElementById('refreshInterviews').disabled = false;
            }
        }

        function dateAtStart(value) {
            const date = new Date(value);
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function isToday(value) {
            return dateAtStart(value).getTime() === dateAtStart(new Date()).getTime();
        }

        function formatDateTime(value) {
            return new Date(value).toLocaleString('zh-CN', {
                month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function getReminder(interview, now = new Date()) {
            const ended = ['已淘汰', '已归档'].includes(interview.candidate_stage);
            if (interview.status !== '已安排' || ended || interview.feedback_result) return null;
            const start = new Date(interview.start_time);
            const end = new Date(interview.end_time || interview.start_time);
            const minute = 60 * 1000;
            if (start > now && start <= new Date(now.getTime() + 30 * minute)) {
                return { type: 'soon', label: '即将开始', text: `${interview.candidate_name || '候选人'} 的面试将在 30 分钟内开始` };
            }
            if (end <= now && end > new Date(now.getTime() - 24 * 60 * minute)) {
                return { type: 'overdue', label: '面试已超时', text: `${interview.candidate_name || '候选人'} 的面试已过计划结束时间` };
            }
            if (end <= new Date(now.getTime() - 24 * 60 * minute)) {
                return { type: 'late', label: '反馈逾期', text: `${interview.candidate_name || '候选人'} 的面试反馈已逾期` };
            }
            return null;
        }

        function renderReminders(now) {
            const reminders = myInterviews.map(interview => ({ interview, reminder: getReminder(interview, now) }))
                .filter(item => item.reminder)
                .sort((a, b) => new Date(a.interview.start_time) - new Date(b.interview.start_time));
            document.getElementById('reminderCount').textContent = `${reminders.length} 项`;
            document.getElementById('reminderList').innerHTML = reminders.length ? reminders.map(({ interview, reminder }) => {
                const detailUrl = `interview-detail.html?id=${encodeURIComponent(interview.id)}&v=20`;
                return `<div class="reminder-item"><div class="reminder-copy"><span class="reminder-label ${reminder.type}">${reminder.label}</span><span class="reminder-text">${escapeHtml(reminder.text)}</span><span class="reminder-time">计划时间：${formatDateTime(interview.start_time)}</span></div><a class="btn reminder-link" href="${detailUrl}">查看详情</a></div>`;
            }).join('') : '<div class="reminder-empty">当前没有需要处理的面试提醒</div>';
        }

        function card(interview) {
            const start = new Date(interview.start_time);
            const now = new Date();
            const pending = matchesFilter(interview, 'feedback', now);
            const closed = matchesFilter(interview, 'closed', now);
            const statusClass = closed ? 'closed' : (interview.feedback_result ? 'done' : (pending ? 'overdue' : ''));
            const statusText = closed ? (interview.status === '已取消' ? '已取消' : '流程已中止')
                : (interview.feedback_result ? `已评价：${escapeHtml(interview.feedback_result)}`
                : (pending ? '待填写反馈' : (start <= now && interview.status === '已安排' ? '进行中' : escapeHtml(interview.status || '已安排'))));
            const detailUrl = `interview-detail.html?id=${encodeURIComponent(interview.id)}&v=20`;
            const actionLabel = pending ? '填写反馈' : (interview.feedback_result ? '查看反馈' : '查看面试');
            const action = `<a class="btn ${pending ? 'btn-primary' : ''} card-action" href="${detailUrl}">${actionLabel}</a>`;
            return `<div class="interview-card">
                <div><div class="eyebrow">候选人</div><div class="candidate-name">${escapeHtml(interview.candidate_name || '未知候选人')}</div></div>
                <div><div class="eyebrow">职位与时间</div><div class="interview-meta">${escapeHtml(interview.job_title || '--')}<br>${formatDateTime(interview.start_time)}</div></div>
                <div><div class="eyebrow">地点与状态</div><div class="interview-meta">${escapeHtml(interview.location || '线上面试')}<br><span class="status ${statusClass}">${statusText}</span></div></div>
                <div class="interview-actions">${action}</div>
            </div>`;
        }

        function matchesFilter(item, filter, now) {
            const ended = ['已淘汰', '已归档'].includes(item.candidate_stage);
            const active = item.status === '已安排' && !ended && !item.feedback_result;
            const start = new Date(item.start_time);
            const end = new Date(item.end_time || item.start_time);
            switch (filter) {
                case 'today': return item.status !== '已取消' && (!ended || Boolean(item.feedback_result)) && isToday(item.start_time);
                case 'feedback': return active && end <= now;
                case 'upcoming': return active && start > now && start <= new Date(now.getTime() + 7 * 86400000);
                case 'completed': return item.status !== '已取消' && (Boolean(item.feedback_result) || item.status === '已完成');
                case 'closed': return item.status === '已取消' || (ended && !item.feedback_result);
                default: return true;
            }
        }

        function updateFilters() {
            const query = document.getElementById('interviewSearch').value.trim();
            const sort = document.getElementById('interviewSort').value;
            const url = new URL(window.location.href);
            if (activeFilter === 'all') url.searchParams.delete('filter'); else url.searchParams.set('filter', activeFilter);
            if (query) url.searchParams.set('q', query); else url.searchParams.delete('q');
            if (sort === 'asc') url.searchParams.delete('sort'); else url.searchParams.set('sort', sort);
            history.replaceState(null, '', url);
            if (loaded) renderWorkbench();
        }

        function renderWorkbench() {
            const now = new Date();
            renderReminders(now);
            for (const filter of ['today', 'feedback', 'upcoming', 'completed']) {
                document.getElementById(`${filter}Count`).textContent = myInterviews.filter(item => matchesFilter(item, filter, now)).length;
            }
            const query = document.getElementById('interviewSearch').value.trim().toLocaleLowerCase();
            const descending = document.getElementById('interviewSort').value === 'desc';
            const items = myInterviews.filter(item => matchesFilter(item, activeFilter, now)
                && `${item.candidate_name || ''} ${item.job_title || ''}`.toLocaleLowerCase().includes(query))
                .sort((a, b) => (descending ? -1 : 1) * (new Date(a.start_time) - new Date(b.start_time)) || a.id - b.id);
            document.querySelectorAll('.filter-tab').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter)));
            document.getElementById('clearFilters').hidden = activeFilter === 'all' && !query && !descending;
            document.getElementById('resultCount').textContent = `${items.length} 场面试${activeFilter === 'upcoming' ? ' · 未来 7 天' : ''}`;
            document.getElementById('interviewList').innerHTML = items.length ? items.map(card).join('')
                : `<div class="empty-state">${myInterviews.length ? '没有符合筛选条件的面试' : '暂无分配给你的面试'}</div>`;
        }
    </script>
</body>
</html>
