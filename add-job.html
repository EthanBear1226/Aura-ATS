<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新职位 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=3">
    <style>
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="max-width: 600px; margin: 0 auto; padding-top: 40px;">
                <h1 class="page-title" style="margin-bottom: 32px;">发布新职位</h1>
                
                <div class="card">
                    <form id="jobForm" class="auth-form">
                        <div class="form-group">
                            <label>职位名称</label>
                            <input type="text" id="jobTitle" required placeholder="如：高级前端工程师">
                        </div>
                        <div class="form-group">
                            <label>所属部门</label>
                            <input type="text" id="jobDepartment" required placeholder="如：研发部">
                        </div>
                        <div class="form-group">
                            <label>工作地点</label>
                            <input type="text" id="jobLocation" required placeholder="如：深圳">
                        </div>
                        <div class="form-group">
                            <label>负责人名称</label>
                            <input type="text" id="jobHrName" required placeholder="如：HR 李">
                        </div>
                        <div style="display:flex; gap:12px; margin-top:32px; justify-content:flex-end;">
                            <button type="button" class="btn" onclick="window.history.back()">取消返回</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">确认发布</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=4"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('jobs');
            renderHeader();
            
            document.getElementById('jobForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await createJob();
            });
        });

        async function createJob() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "发布中...";

            const data = {
                title: document.getElementById('jobTitle').value,
                department: document.getElementById('jobDepartment').value,
                location: document.getElementById('jobLocation').value,
                hr_name: document.getElementById('jobHrName').value,
                status: "热招中"
            };

            try {
                const response = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    if(window.showToast) showToast("发布成功", "success");
                    setTimeout(() => {
                        window.location.href = 'jobs.html';
                    }, 1000);
                } else {
                    if(window.showToast) showToast("发布失败", "error");
                    btn.disabled = false;
                    btn.innerText = "确认发布";
                }
            } catch (error) {
                console.error("Error creating job:", error);
                if(window.showToast) showToast("发布异常", "error");
                btn.disabled = false;
                btn.innerText = "确认发布";
            }
        }
    </script>
</body>
</html>
