<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新职位 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
    <!-- 引入 Quill 雪白主题样式 -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.snow.css" rel="stylesheet">
    <style>
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
        }
        .form-group select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            padding-right: 40px;
        }

        /* 新增双列网格布局 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        
        /* 薪资组合框样式 */
        .salary-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .salary-group input {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            min-width: 60px;
        }
        .salary-unit {
            color: var(--text-secondary);
            font-size: 14px;
            white-space: nowrap;
        }
        .salary-sep {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* Quill 编辑器覆写 */
        #editor-container {
            height: 250px;
            background: white;
            border-bottom-left-radius: var(--radius-sm);
            border-bottom-right-radius: var(--radius-sm);
        }
        .ql-toolbar.ql-snow {
            border-top-left-radius: var(--radius-sm);
            border-top-right-radius: var(--radius-sm);
            background: #fafafa;
            border-color: var(--border-color);
        }
        .ql-container.ql-snow {
            border-color: var(--border-color);
            font-family: inherit;
            font-size: 14px;
        }
        
        /* 隐藏未初始化的原生 select 以防页面加载瞬间闪烁 */
        .form-group select:not(.hidden-select) {
            opacity: 0;
            position: absolute;
            height: 0;
            width: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* 树形检索选择器专属样式 */
        .tree-select-container { position: relative; width: 100%; }
        .tree-select-display { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; background: white; cursor: pointer; transition: all 0.2s ease; user-select: none; box-sizing: border-box; }
        .tree-select-display:hover { border-color: var(--primary-color); }
        .tree-select-container.active .tree-select-display { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(10,132,255,0.1); }
        .tree-select-arrow { font-size: 10px; color: var(--text-secondary); transition: transform 0.2s ease; }
        .tree-select-container.active .tree-select-arrow { transform: rotate(180deg); }
        .tree-select-dropdown { display: none; position: absolute; top: 100%; left: 0; width: 100%; margin-top: 6px; background: white; border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); z-index: 1050; max-height: 260px; overflow-y: auto; box-sizing: border-box; padding: 8px 8px 0 8px; }
        .tree-select-container.active .tree-select-dropdown { display: block; animation: slideDown 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .tree-select-search-box { padding: 4px; margin-bottom: 8px; }
        .tree-select-search-box input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 13px; outline: none; box-sizing: border-box; }
        .tree-select-search-box input:focus { border-color: var(--primary-color); }
        .tree-select-nodes-root { padding: 2px; }
        .tree-select-node { margin: 2px 0; }
        .tree-select-node-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; user-select: none; }
        .tree-select-node-item:hover { background: #f5f9ff; }
        .tree-select-node-item.selected { background: #e6f7ff; color: var(--primary-color); font-weight: 500; }
        .tree-select-node-item.selected::after { content: '✓'; margin-left: auto; color: var(--primary-color); font-size: 14px; font-weight: bold; }
        .tree-select-node-toggle { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; font-size: 8px; color: var(--text-secondary); margin-right: 4px; transition: transform 0.15s; }
        .tree-select-node-toggle.collapsed { transform: rotate(-90deg); }
        .tree-select-node-text { font-size: 13px; }
        .tree-select-children { padding-left: 20px; border-left: 1px dashed #e8e8e8; margin-left: 8px; }
        .tree-select-children.collapsed { display: none; }

        /* 树形下拉底部快捷操作栏 */
        .tree-select-footer { display: flex; align-items: center; justify-content: center; padding: 10px; border-top: 1px solid var(--border-color); margin-top: 8px; cursor: pointer; color: var(--primary-color); font-size: 13px; font-weight: 500; background: #fff; position: sticky; bottom: 0; margin-left: -8px; margin-right: -8px; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; transition: background 0.2s; }
        .tree-select-footer:hover { background: #f5f9ff; }

        /* 迷你新增部门弹窗样式 */
        .mini-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .mini-modal.active { display: flex; }
        .mini-modal-card { width: 380px; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); box-sizing: border-box; }
        .mini-modal-card h3 { margin-top: 0; margin-bottom: 20px; font-size: 17px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="max-width: 800px; margin: 0 auto; padding-top: 40px;">
                <h1 class="page-title" style="margin-bottom: 32px;">发布新职位</h1>
                
                <div class="card">
                    <form id="jobForm" class="auth-form" novalidate>
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>职位名称<span class="required-mark">*</span></label>
                                <input type="text" id="jobTitle" required placeholder="如：高级前端工程师" autocomplete="off">
                            </div>
                            
                             <div class="form-group" style="position:relative;">
                                 <label>所属部门<span class="required-mark">*</span></label>
                                 <div class="tree-select-container" id="jobDeptContainer">
                                     <div class="tree-select-display" onclick="toggleTreeSelectDropdown(event)">
                                         <span id="tree-select-val-text">请选择所属部门...</span>
                                         <span class="tree-select-arrow">▼</span>
                                     </div>
                                     <div class="tree-select-dropdown" id="treeSelectDropdown">
                                         <div class="tree-select-search-box">
                                             <input type="text" id="treeSelectSearchInput" placeholder="输入部门名称检索..." oninput="filterTreeSelectNodes(event)" onclick="event.stopPropagation()" autocomplete="off">
                                         </div>
                                         <div class="tree-select-nodes-root" id="treeSelectNodesRoot"></div>
                                         <div class="tree-select-footer" onclick="openMiniDeptModal(event)">
                                             <span>+ 新增部门</span>
                                         </div>
                                     </div>
                                 </div>
                             </div>
                            <div class="form-group">
                                <label>工作地点<span class="required-mark">*</span></label>
                                <select id="jobLocation" required>
                                    <option value="" disabled selected>请选择工作地点</option>
                                    <option value="北京">北京</option>
                                    <option value="上海">上海</option>
                                    <option value="深圳">深圳</option>
                                    <option value="广州">广州</option>
                                    <option value="杭州">杭州</option>
                                    <option value="成都">成都</option>
                                    <option value="远程办公">远程办公</option>
                                </select>
                            </div>

                             <div class="form-group" style="position:relative;">
                                 <label>职位类别<span class="required-mark">*</span></label>
                                 <div class="tree-select-container" id="jobCategoryContainer">
                                     <div class="tree-select-display" onclick="toggleCategorySelectDropdown(event)">
                                         <span id="category-select-val-text">请选择职位类别...</span>
                                         <span class="tree-select-arrow">▼</span>
                                     </div>
                                     <div class="tree-select-dropdown" id="categorySelectDropdown">
                                         <div class="tree-select-search-box">
                                             <input type="text" id="categorySelectSearchInput" placeholder="输入类别名称检索..." oninput="filterCategorySelectNodes(event)" onclick="event.stopPropagation()" autocomplete="off">
                                         </div>
                                         <div class="tree-select-nodes-root" id="categorySelectNodesRoot"></div>
                                     </div>
                                 </div>
                             </div>
                            <div class="form-group">
                                <label>职位性质</label>
                                <input type="hidden" id="jobType" required value="全职">
                                <div class="segmented-control" data-target="jobType">
                                    <div class="segmented-item active" data-value="全职">全职</div>
                                    <div class="segmented-item" data-value="兼职">兼职</div>
                                    <div class="segmented-item" data-value="实习">实习</div>
                                    <div class="segmented-item" data-value="外包">外包</div>
                                </div>
                            </div>

                            <div class="form-group full-width">
                                <label>工作经验</label>
                                <input type="hidden" id="jobExperience" required value="不限">
                                <div class="segmented-control" data-target="jobExperience">
                                    <div class="segmented-item active" data-value="不限">不限</div>
                                    <div class="segmented-item" data-value="应届生">应届生</div>
                                    <div class="segmented-item" data-value="1-3年">1-3年</div>
                                    <div class="segmented-item" data-value="3-5年">3-5年</div>
                                    <div class="segmented-item" data-value="5-10年">5-10年</div>
                                    <div class="segmented-item" data-value="10年以上">10年以上</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>职级</label>
                                <input type="hidden" id="jobLevel" required>
                                <div class="segmented-control" data-target="jobLevel">
                                    <div class="segmented-item" data-value="初级">初级</div>
                                    <div class="segmented-item" data-value="中级">中级</div>
                                    <div class="segmented-item" data-value="高级">高级</div>
                                    <div class="segmented-item" data-value="资深/专家">资深/专家</div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>招聘人数</label>
                                <input type="number" id="jobHeadcount" required min="1" value="1" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label>薪资范围<span class="required-mark">*</span></label>
                                <div class="salary-group">
                                    <input type="number" id="jobSalaryMin" placeholder="下限" min="0" autocomplete="off">
                                    <span class="salary-unit">k</span>
                                    <span class="salary-sep">-</span>
                                    <input type="number" id="jobSalaryMax" placeholder="上限" min="0" autocomplete="off">
                                    <span class="salary-unit">k</span>
                                    <span class="salary-sep">×</span>
                                    <input type="number" id="jobSalaryMonths" required min="12" max="24" value="12" title="薪资发放月数" autocomplete="off">
                                    <span class="salary-unit">薪</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>负责人名称<span class="required-mark">*</span></label>
                                <select id="jobHrName" required>
                                    <option value="" disabled selected>加载中...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>面试流程</label>
                                <select id="jobInterviewProcess" required>
                                    <option value="" disabled selected>请选择默认面试流程</option>
                                    <option value="标准技术面 (笔试+2轮技术+HR)">标准技术面 (笔试+2轮技术+HR)</option>
                                    <option value="高管直面 (1轮直属+CEO直面)">高管直面 (1轮直属+CEO直面)</option>
                                    <option value="非技术岗标准面 (1轮业务+HR)">非技术岗标准面 (1轮业务+HR)</option>
                                    <option value="实习生面 (1轮业务+HR)">实习生面 (1轮业务+HR)</option>
                                </select>
                            </div>

                            <div class="form-group full-width">
                                <label>职位介绍（职责与要求）</label>
                                <div id="editor-container"></div>
                            </div>
                        </div>

                        <div style="display:flex; gap:12px; margin-top:32px; justify-content:flex-end;">
                            <button type="button" class="btn" onclick="window.history.back()">取消返回</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">确认发布</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=18"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.js"></script>
    <script>
        let quill;

        // --- 树状选择器 (TreeSelect) 原生核心引擎 ---
        let selectedJobDept = '';
        let cachedDepts = [];

        // --- 职位类别检索选择器 (CategorySelect) 原生核心引擎 ---
        let selectedJobCategory = '';
        const standardCategories = ["BI类", "技术类", "产品类", "设计类", "运营类", "市场类", "职能类", "销售类", "管理类", "金融类", "战略投资类"];

        function toggleCategorySelectDropdown(event) {
            event.stopPropagation();
            document.getElementById('jobCategoryContainer').classList.toggle('active');
        }

        function selectCategorySelectNode(catName) {
            selectedJobCategory = catName;
            document.getElementById('category-select-val-text').innerText = catName || '请选择职位类别...';
            
            const displayEl = document.getElementById('jobCategoryContainer') ? document.getElementById('jobCategoryContainer').querySelector('.tree-select-display') : null;
            if (displayEl) displayEl.classList.remove('has-error');
            
            document.querySelectorAll('#categorySelectNodesRoot .tree-select-node-item').forEach(el => {
                if (el.getAttribute('data-name') === catName) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
            document.getElementById('jobCategoryContainer').classList.remove('active');
        }

        function filterCategorySelectNodes(event) {
            const keyword = event.target.value.trim().toLowerCase();
            document.querySelectorAll('#categorySelectNodesRoot .tree-select-node').forEach(el => {
                const textEl = el.querySelector('.tree-select-node-text');
                const name = textEl ? textEl.innerText.toLowerCase() : '';
                if (!keyword || name.includes(keyword)) {
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        function initCategoryTreeSelect(cats = []) {
            const list = (cats && cats.length > 0) ? cats.map(c => c.name) : [...standardCategories];
            
            // 确保 11 大核心类别始终完整展现（将后端列表和标准列表去重合并）
            standardCategories.forEach(s => {
                if (!list.includes(s)) list.push(s);
            });

            const root = document.getElementById('categorySelectNodesRoot');
            if (root) {
                root.innerHTML = list.map(name => {
                    const isSelected = selectedJobCategory === name ? 'selected' : '';
                    return `
                        <div class="tree-select-node">
                            <div class="tree-select-node-item ${isSelected}" data-name="${name}" onclick="selectCategorySelectNode('${name}')">
                                <span class="tree-select-node-text">${name}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function buildTree(depts) {
            const idMap = {};
            depts.forEach(d => { idMap[d.id] = { ...d, children: [] }; });
            const tree = [];
            depts.forEach(d => {
                const mapped = idMap[d.id];
                if (d.parent_id && idMap[d.parent_id]) {
                    idMap[d.parent_id].children.push(mapped);
                } else {
                    tree.push(mapped);
                }
            });
            return tree;
        }

        function toggleTreeSelectDropdown(event) {
            event.stopPropagation();
            document.getElementById('jobDeptContainer').classList.toggle('active');
        }

        function renderTreeSelectNode(node) {
            const hasChildren = node.children && node.children.length > 0;
            const toggleHtml = hasChildren 
                ? `<span class="tree-select-node-toggle" onclick="toggleTreeSelectNodeCollapse(${node.id}, event)">▼</span>` 
                : `<span class="tree-select-node-toggle" style="visibility:hidden;">▼</span>`;
            
            let childrenHtml = '';
            if (hasChildren) {
                childrenHtml = `
                    <div class="tree-select-children" id="tree-select-children-${node.id}">
                        ${node.children.map(c => renderTreeSelectNode(c)).join('')}
                    </div>
                `;
            }

            const isSelected = selectedJobDept === node.name ? 'selected' : '';

            return `
                <div class="tree-select-node" id="tree-select-node-${node.id}">
                    <div class="tree-select-node-item ${isSelected}" data-name="${node.name}" onclick="selectTreeSelectNode('${node.name}')">
                        ${toggleHtml}
                        <span class="tree-select-node-text">${node.name}</span>
                    </div>
                    ${childrenHtml}
                </div>
            `;
        }

        function toggleTreeSelectNodeCollapse(id, event) {
            event.stopPropagation();
            const container = document.getElementById(`tree-select-children-${id}`);
            const toggle = event.currentTarget;
            if (container) {
                container.classList.toggle('collapsed');
                toggle.classList.toggle('collapsed');
            }
        }

        function selectTreeSelectNode(deptName) {
            selectedJobDept = deptName;
            document.getElementById('tree-select-val-text').innerText = deptName || '请选择所属部门...';
            
            const displayEl = document.getElementById('jobDeptContainer') ? document.getElementById('jobDeptContainer').querySelector('.tree-select-display') : null;
            if (displayEl) displayEl.classList.remove('has-error');

            document.querySelectorAll('.tree-select-node-item').forEach(el => {
                if (el.getAttribute('data-name') === deptName) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
            document.getElementById('jobDeptContainer').classList.remove('active');
        }

        function filterTreeSelectNodes(event) {
            const keyword = event.target.value.trim().toLowerCase();
            if (!keyword) {
                document.querySelectorAll('.tree-select-node').forEach(el => el.style.display = 'block');
                return;
            }
            
            function hasMatchingDescendant(dept) {
                if (dept.name.toLowerCase().includes(keyword)) return true;
                const children = cachedDepts.filter(d => d.parent_id === dept.id);
                return children.some(c => hasMatchingDescendant(c));
            }
            
            cachedDepts.forEach(d => {
                const nodeEl = document.getElementById(`tree-select-node-${d.id}`);
                if (nodeEl) {
                    if (hasMatchingDescendant(d)) {
                        nodeEl.style.display = 'block';
                        if (d.parent_id) {
                            const parentContainer = document.getElementById(`tree-select-children-${d.parent_id}`);
                            const parentToggle = parentContainer ? parentContainer.previousElementSibling.querySelector('.tree-select-node-toggle') : null;
                            if (parentContainer) parentContainer.classList.remove('collapsed');
                            if (parentToggle) parentToggle.classList.remove('collapsed');
                        }
                    } else {
                        nodeEl.style.display = 'none';
                    }
                }
            });
        }

        // 迷你新增部门弹窗控制
        function openMiniDeptModal(event) {
            event.stopPropagation();
            document.getElementById('miniDeptName').value = '';
            
            // 填充上级部门选择
            const parentSelect = document.getElementById('miniDeptParent');
            parentSelect.innerHTML = '<option value="">(无上级部门 - 作为一级部门)</option>' + 
                cachedDepts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
                
            document.getElementById('miniDeptModal').classList.add('active');
        }

        function closeMiniDeptModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('miniDeptModal').classList.remove('active');
        }

        async function submitMiniDept(event) {
            event.stopPropagation();
            const name = document.getElementById('miniDeptName').value.trim();
            if (!name) { alert('请输入部门名称'); return; }
            
            const parentIdVal = document.getElementById('miniDeptParent').value;
            const parent_id = parentIdVal ? Number(parentIdVal) : null;
            
            try {
                const response = await fetch('/api/settings/departments', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, parent_id })
                });
                
                if (response.ok) {
                    const newDept = await response.json();
                    closeMiniDeptModal();
                    // 重新拉取并应用
                    await reloadDeptTreeSelect(newDept.name);
                    if(window.showToast) showToast('新增部门成功', 'success');
                } else {
                    const err = await response.json();
                    alert(err.detail || '该部门名称已存在，请勿重复添加');
                }
            } catch(e) {
                alert('网络异常');
            }
        }

        async function reloadDeptTreeSelect(autoSelectName = '') {
            try {
                const depts = await fetch('/api/settings/departments').then(r=>r.json());
                cachedDepts = depts;
                const tree = buildTree(depts);
                const root = document.getElementById('treeSelectNodesRoot');
                if (tree.length === 0) {
                    root.innerHTML = '<div style="text-align:center; padding:12px; color:var(--text-secondary); font-size:13px;">暂无可用部门</div>';
                } else {
                    root.innerHTML = tree.map(node => renderTreeSelectNode(node)).join('');
                }
                if (autoSelectName) {
                    selectTreeSelectNode(autoSelectName);
                }
            } catch(e) {
                console.error(e);
            }
        }

        // 全局点击失焦收起
        document.addEventListener('click', (e) => {
            const container = document.getElementById('jobDeptContainer');
            if (container && !container.contains(e.target)) {
                container.classList.remove('active');
            }
            const catContainer = document.getElementById('jobCategoryContainer');
            if (catContainer && !catContainer.contains(e.target)) {
                catContainer.classList.remove('active');
            }
        });
        
        document.addEventListener("DOMContentLoaded", async () => {
            renderSidebar('jobs');
            renderHeader();
            
            await loadDictionaries();
            
            setupCustomSelects();
            setupSegmentedControls();
            
            // 初始化 Quill 文本编辑器
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: '请输入职位描述和任职要求...',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ]
                }
            });
            
            document.getElementById('jobForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await createJob();
            });

            // 添加实时消除报错样式的交互
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('has-error');
                });
            });
            
            document.querySelectorAll('select').forEach(select => {
                select.addEventListener('change', () => {
                    const wrapper = select.closest('.custom-select-wrapper');
                    if (wrapper) {
                        wrapper.querySelector('.custom-select-trigger').classList.remove('has-error');
                    }
                });
            });
        });

        async function loadDictionaries() {
            try {
                // 部门树形选择器加载
                await reloadDeptTreeSelect();

                // 地点
                const locs = await fetch('/api/settings/locations').then(r=>r.json());
                const locSelect = document.getElementById('jobLocation');
                locSelect.innerHTML = '<option value="" disabled selected>请选择工作地点</option>' + locs.map(d => `<option value="${d.name}">${d.name}</option>`).join('');

                // 面试官(HR)
                const hrs = await fetch('/api/settings/interviewers').then(r=>r.json());
                const hrSelect = document.getElementById('jobHrName');
                hrSelect.innerHTML = '<option value="" disabled selected>请选择负责人</option>' + hrs.map(d => `<option value="${d.name}">${d.name}</option>`).join('');

                // 职位类别 (自定义搜索下拉树)
                try {
                    const cats = await fetch('/api/settings/categories').then(r=>r.json());
                    initCategoryTreeSelect(cats);
                } catch (e) {
                    console.error("Failed to load job categories dictionary", e);
                    initCategoryTreeSelect([]); // 异常时使用 standardCategories 兜底
                }
            } catch(e) {
                console.error("Failed to load dictionaries", e);
            }
        }

        function setupCustomSelects() {
            document.querySelectorAll('.form-group select').forEach(select => {
                if(select.parentNode.classList.contains('custom-select-wrapper')) return;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'custom-select-wrapper';
                select.parentNode.insertBefore(wrapper, select);
                wrapper.appendChild(select);
                select.classList.add('hidden-select');
                
                const trigger = document.createElement('div');
                trigger.className = 'custom-select-trigger';
                
                const span = document.createElement('span');
                const defaultOption = select.querySelector('option[selected]') || select.options[0];
                span.innerText = defaultOption ? defaultOption.innerText : '';
                
                if (!defaultOption || defaultOption.disabled || !defaultOption.value) {
                     trigger.classList.add('placeholder');
                }
                
                trigger.appendChild(span);
                
                const iconContainer = document.createElement('div');
                iconContainer.style.display = 'flex';
                iconContainer.style.alignItems = 'center';
                iconContainer.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
                trigger.appendChild(iconContainer.firstChild);
                
                wrapper.appendChild(trigger);
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'custom-select-options';
                
                Array.from(select.options).forEach(option => {
                    if (option.disabled) return;
                    const optDiv = document.createElement('div');
                    optDiv.className = 'custom-option';
                    if(option.selected) optDiv.classList.add('selected');
                    optDiv.innerText = option.innerText;
                    optDiv.dataset.value = option.value;
                    
                    optDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        select.value = option.value;
                        span.innerText = option.innerText;
                        trigger.classList.remove('placeholder');
                        
                        wrapper.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                        optDiv.classList.add('selected');
                        
                        wrapper.classList.remove('open');
                        select.dispatchEvent(new Event('change'));
                    });
                    optionsDiv.appendChild(optDiv);
                });
                
                wrapper.appendChild(optionsDiv);
                
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = wrapper.classList.contains('open');
                    document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
                    if (!isOpen) wrapper.classList.add('open');
                });
            });
            
            document.addEventListener('click', () => {
                document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
            });
        }

        function setupSegmentedControls() {
            document.querySelectorAll('.segmented-control').forEach(control => {
                const targetId = control.dataset.target;
                const targetInput = document.getElementById(targetId);
                
                control.querySelectorAll('.segmented-item').forEach(item => {
                    item.addEventListener('click', () => {
                        control.querySelectorAll('.segmented-item').forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        targetInput.value = item.dataset.value;
                        control.classList.remove('has-error');
                    });
                });
            });
        }

        async function createJob() {
            let isValid = true;
            document.querySelectorAll('.has-error').forEach(el => el.classList.remove('has-error'));

            // 验证部门（下拉树）
            if (!selectedJobDept) {
                isValid = false;
                const displayEl = document.getElementById('jobDeptContainer') ? document.getElementById('jobDeptContainer').querySelector('.tree-select-display') : null;
                if (displayEl) displayEl.classList.add('has-error');
            }

            const requiredSelects = ['jobLocation', 'jobHrName'];
            requiredSelects.forEach(id => {
                const select = document.getElementById(id);
                if (select && !select.value) {
                    isValid = false;
                    const wrapper = select.closest('.custom-select-wrapper');
                    if (wrapper) {
                        wrapper.querySelector('.custom-select-trigger').classList.add('has-error');
                    }
                }
            });

            // 验证职位类别 (Segmented Control)
            const categoryInput = document.getElementById('jobCategory');
            if (categoryInput && !categoryInput.value) {
                isValid = false;
                const ctrl = document.querySelector('.segmented-control[data-target="jobCategory"]');
                if (ctrl) ctrl.classList.add('has-error');
            }

            // 验证职级 (Segmented Control)
            const levelInput = document.getElementById('jobLevel');
            if (levelInput && !levelInput.value) {
                isValid = false;
                const ctrl = document.querySelector('.segmented-control[data-target="jobLevel"]');
                if (ctrl) ctrl.classList.add('has-error');
            }

            const jobTitle = document.getElementById('jobTitle');
            if (jobTitle && !jobTitle.value.trim()) {
                isValid = false;
                jobTitle.classList.add('has-error');
            }

            const min = document.getElementById('jobSalaryMin').value;
            const max = document.getElementById('jobSalaryMax').value;
            if (!min && !max) {
                isValid = false;
                document.getElementById('jobSalaryMin').classList.add('has-error');
                document.getElementById('jobSalaryMax').classList.add('has-error');
            }

            if (!isValid) {
                if(window.showToast) showToast("请填写所有带星号的必填信息", "error");
                else alert("请填写所有带星号的必填信息");
                const firstError = document.querySelector('.has-error');
                if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "发布中...";

            // 获取富文本内容，如果为空则是 <p><br></p>
            const descriptionHTML = quill.root.innerHTML === '<p><br></p>' ? '' : quill.root.innerHTML;

            // 处理薪资范围
            let salaryRange = "面议";
            if (min && max) {
                salaryRange = `${min}k-${max}k`;
            } else if (min) {
                salaryRange = `${min}k以上`;
            } else if (max) {
                salaryRange = `${max}k以下`;
            }

            const data = {
                title: document.getElementById('jobTitle').value,
                department: selectedJobDept,
                location: document.getElementById('jobLocation').value,
                hr_name: document.getElementById('jobHrName').value,
                interview_process: document.getElementById('jobInterviewProcess').value,
                status: "热招中",
                
                category: document.getElementById('jobCategory').value,
                job_type: document.getElementById('jobType').value,
                experience: document.getElementById('jobExperience').value,
                job_level: document.getElementById('jobLevel').value,
                headcount: parseInt(document.getElementById('jobHeadcount').value, 10),
                salary_range: salaryRange,
                salary_months: parseInt(document.getElementById('jobSalaryMonths').value, 10),
                description: descriptionHTML
            };

            try {
                const response = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    if(window.showToast) showToast("发布成功", "success");
                    setTimeout(() => {
                        window.location.href = 'jobs.html';
                    }, 1000);
                } else {
                    if(window.showToast) showToast("发布失败", "error");
                    btn.disabled = false;
                    btn.innerText = "确认发布";
                }
            } catch (error) {
                console.error("Error creating job:", error);
                if(window.showToast) showToast("发布异常", "error");
                btn.disabled = false;
                btn.innerText = "确认发布";
            }
        }
    </script>

    <!-- 迷你新增部门快捷弹窗 -->
    <div class="mini-modal" id="miniDeptModal" onclick="closeMiniDeptModal(event)">
        <div class="mini-modal-card" onclick="event.stopPropagation()">
            <h3>新增部门</h3>
            <div class="form-group">
                <label>部门名称<span class="required-mark">*</span></label>
                <input type="text" id="miniDeptName" class="form-control" placeholder="请输入部门名称..." style="width:100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; outline:none;" autocomplete="off">
            </div>
            <div class="form-group" style="margin-top: 16px;">
                <label>上级部门</label>
                <select id="miniDeptParent" class="form-control" style="-webkit-appearance:auto; -moz-appearance:auto; appearance:auto; width:100%; height:40px; padding:8px 12px; background:white; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box;">
                    <option value="">(无上级部门 - 作为一级部门)</option>
                </select>
            </div>
            <div style="display:flex; gap:12px; margin-top:28px;">
                <button class="btn" style="flex:1; justify-content:center; padding: 10px;" onclick="closeMiniDeptModal(event)">取消</button>
                <button class="btn btn-primary" style="flex:1; justify-content:center; padding: 10px;" onclick="submitMiniDept(event)">保存生效</button>
            </div>
        </div>
    </div>
</body>
