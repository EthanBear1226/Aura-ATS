<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=14">
    <style>
        .settings-layout { display: flex; height: calc(100vh - 64px); background: #fff; }
        .settings-nav { width: 240px; border-right: 1px solid var(--border-color); background: #fafafa; padding: 24px 0; }
        .settings-nav-header { padding: 0 24px 16px; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; font-weight: 600; }
        .settings-nav-item { padding: 12px 24px; cursor: pointer; color: var(--text-primary); font-weight: 500; font-size: 14px; transition: var(--transition); border-right: 3px solid transparent; }
        .settings-nav-item:hover { background: #f0f0f0; }
        .settings-nav-item.active { background: #e8f4fd; color: var(--primary-color); border-right-color: var(--primary-color); }
        
        .settings-content { flex: 1; padding: 40px 60px; overflow-y: auto; background: var(--card-bg); }
        .settings-section { display: none; max-width: 900px; }
        .settings-section.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .section-title { margin: 0; font-size: 24px; font-weight: 600; }
        
        .empty-state { text-align: center; padding: 80px 0; color: var(--text-secondary); }
        .empty-state svg { margin-bottom: 16px; opacity: 0.3; }

        /* 精美弹窗覆盖 */
        .modal-card { width: 440px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .form-control { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; outline: none; transition: var(--transition); box-sizing: border-box; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(10,132,255,0.1); }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="settings-layout">
                <div class="settings-nav">
                    <div class="settings-nav-header">基础配置</div>
                    <div class="settings-nav-item active" onclick="switchSetting('departments', event)">🏢 部门架构</div>
                    <div class="settings-nav-item" onclick="switchSetting('interviewers', event)">👥 人员管理</div>
                    <div class="settings-nav-item" onclick="switchSetting('locations', event)">📍 面试地点</div>
                    <div class="settings-nav-item" onclick="switchSetting('processes', event)">🔄 面试流程</div>
                    <div class="settings-nav-item" onclick="switchSetting('categories', event)">🏷️ 职位类别</div>
                </div>
                <div class="settings-content">
                    <!-- Departments -->
                    <div id="sec-departments" class="settings-section active">
                        <div class="section-header">
                            <h2 class="section-title">部门架构管理</h2>
                            <button class="btn btn-primary" onclick="openDictModal('departments', '新增部门')">+ 新增部门</button>
                        </div>
                        <table class="table-container">
                            <thead><tr><th>部门名称</th><th style="text-align:right;">操作</th></tr></thead>
                            <tbody id="tb-departments"></tbody>
                        </table>
                    </div>

                    <!-- Interviewers -->
                    <div id="sec-interviewers" class="settings-section">
                        <div class="section-header">
                            <h2 class="section-title">人员库管理</h2>
                            <button class="btn btn-primary" onclick="openDictModal('interviewers', '新增人员')">+ 新增人员</button>
                        </div>
                        <table class="table-container">
                            <thead><tr><th>姓名</th><th>角色</th><th style="text-align:right;">操作</th></tr></thead>
                            <tbody id="tb-interviewers"></tbody>
                        </table>
                    </div>

                    <!-- Locations -->
                    <div id="sec-locations" class="settings-section">
                        <div class="section-header">
                            <h2 class="section-title">办公/面试地点</h2>
                            <button class="btn btn-primary" onclick="openDictModal('locations', '新增地点')">+ 新增地点</button>
                        </div>
                        <table class="table-container">
                            <thead><tr><th>名称</th><th>类型</th><th style="text-align:right;">操作</th></tr></thead>
                            <tbody id="tb-locations"></tbody>
                        </table>
                    </div>

                    <!-- Processes -->
                    <div id="sec-processes" class="settings-section">
                        <div class="section-header">
                            <h2 class="section-title">面试流程模板</h2>
                            <button class="btn btn-primary" onclick="openDictModal('interview-processes', '新增面试流程')">+ 新增流程</button>
                        </div>
                        <table class="table-container">
                            <thead><tr><th>流程名称</th><th>流转节点</th><th style="text-align:right;">操作</th></tr></thead>
                            <tbody id="tb-processes"></tbody>
                        </table>
                    </div>

                    <!-- Categories -->
                    <div id="sec-categories" class="settings-section">
                        <div class="section-header">
                            <h2 class="section-title">职位类别字典</h2>
                            <button class="btn btn-primary" onclick="openDictModal('categories', '新增职位类别')">+ 新增类别</button>
                        </div>
                        <table class="table-container">
                            <thead><tr><th>类别名称</th><th style="text-align:right;">操作</th></tr></thead>
                            <tbody id="tb-categories"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 高保真字典操作弹窗 -->
    <div class="modal-overlay" id="dictModal">
        <div class="modal-card">
            <h2 id="dictModalTitle">新增条目</h2>
            <div class="form-group">
                <label>名称<span class="required-mark">*</span></label>
                <input type="text" id="dictItemName" class="form-control" placeholder="请输入名称">
            </div>
            <!-- 动态注入额外字段 -->
            <div id="dictExtraFields"></div>
            
            <div style="display:flex; gap:12px; margin-top:32px;">
                <button class="btn" style="flex:1; justify-content:center; padding:12px;" onclick="closeDictModal()">取消</button>
                <button class="btn btn-primary" style="flex:1; justify-content:center; padding:12px;" onclick="submitDictItem()">保存生效</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js?v=8"></script>
    <script>
        let currentDictType = '';

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('settings');
            renderHeader();
            loadAllDicts();
        });

        function switchSetting(type, event) {
            document.querySelectorAll('.settings-nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.settings-section').forEach(el => el.classList.remove('active'));
            document.getElementById('sec-' + type).classList.add('active');
        }

        function renderTableRows(tbodyId, data, cols, type) {
            const tbody = document.getElementById(tbodyId);
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${cols}" class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <div>当前暂无数据，请点击上方按钮新增</div>
                </td></tr>`;
                return;
            }
            
            tbody.innerHTML = data.map(d => {
                let extra = '';
                if (type === 'interviewers') {
                    let badgeClass = d.role_type === 'Manager' ? 'tag-blue' : 'tag-gray';
                    extra = `<td><span class="tag ${badgeClass}">${d.role_type}</span></td>`;
                }
                if (type === 'locations') extra = `<td><span class="tag tag-gray">${d.type}</span></td>`;
                if (type === 'interview-processes') extra = `<td><code style="background:#f4f4f4; padding:2px 6px; border-radius:4px; font-size:12px;">${d.stages}</code></td>`;
                
                return `<tr>
                    <td style="font-weight:500; font-size:14px;">${d.name}</td>
                    ${extra}
                    <td style="text-align:right;">
                        <button class="btn" style="color:#FF3B30; padding:6px 12px; font-size:13px;" onclick="deleteDict('${type}', ${d.id})">删除</button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function loadAllDicts() {
            try {
                fetch('/api/settings/departments').then(r=>r.json()).then(d => renderTableRows('tb-departments', d, 2, 'departments'));
                fetch('/api/settings/interviewers').then(r=>r.json()).then(d => renderTableRows('tb-interviewers', d, 3, 'interviewers'));
                fetch('/api/settings/locations').then(r=>r.json()).then(d => renderTableRows('tb-locations', d, 3, 'locations'));
                fetch('/api/settings/interview-processes').then(r=>r.json()).then(d => renderTableRows('tb-processes', d, 3, 'interview-processes'));
                fetch('/api/settings/categories').then(r=>r.json()).then(d => renderTableRows('tb-categories', d, 2, 'categories'));
            } catch(e) { console.error('Failed to load settings', e); }
        }

        function openDictModal(type, title) {
            currentDictType = type;
            document.getElementById('dictModalTitle').innerText = title;
            document.getElementById('dictItemName').value = '';
            
            const extraFields = document.getElementById('dictExtraFields');
            extraFields.innerHTML = '';
            
            if (type === 'interviewers') {
                extraFields.innerHTML = `
                    <div class="form-group" style="margin-top: 20px;">
                        <label>角色分配</label>
                        <select id="dictItemRole" class="form-control">
                            <option value="Manager">用人经理 (Manager)</option>
                            <option value="Interviewer">面试官 (Interviewer)</option>
                            <option value="HR">人事 (HR)</option>
                        </select>
                    </div>
                `;
            } else if (type === 'locations') {
                extraFields.innerHTML = `
                    <div class="form-group" style="margin-top: 20px;">
                        <label>地点类型</label>
                        <select id="dictItemType" class="form-control">
                            <option value="线下">线下实体办公区</option>
                            <option value="线上">线上/虚拟会议</option>
                        </select>
                    </div>
                `;
            } else if (type === 'interview-processes') {
                extraFields.innerHTML = `
                    <div class="form-group" style="margin-top: 20px;">
                        <label>流转节点 (英文逗号分隔)</label>
                        <input type="text" id="dictItemStages" class="form-control" placeholder="如: 初筛,一面,二面,HR面" value="初筛,一面,HR面">
                    </div>
                `;
            }
            
            document.getElementById('dictModal').classList.add('active');
        }

        function closeDictModal() {
            document.getElementById('dictModal').classList.remove('active');
        }

        async function submitDictItem() {
            const name = document.getElementById('dictItemName').value.trim();
            if (!name) { showToast('请输入名称', 'error'); return; }
            
            let payload = { name };
            if (currentDictType === 'interviewers') payload.role_type = document.getElementById('dictItemRole').value;
            else if (currentDictType === 'locations') payload.type = document.getElementById('dictItemType').value;
            else if (currentDictType === 'interview-processes') payload.stages = document.getElementById('dictItemStages').value;
            
            try {
                const response = await fetch(`/api/settings/${currentDictType}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if(response.ok) {
                    showToast('保存成功', 'success');
                    closeDictModal();
                    loadAllDicts();
                } else {
                    showToast('保存失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function deleteDict(type, id) {
            showConfirm("确认要删除该条目吗？删除后相关业务数据可能无法匹配。", async () => {
                try {
                    const response = await fetch(`/api/settings/${type}/${id}`, { method: 'DELETE' });
                    if(response.ok) {
                        showToast('已删除', 'success');
                        loadAllDicts();
                    }
                } catch(e) { showToast('删除失败', 'error'); }
            });
        }
    </script>
</body>
</html>
