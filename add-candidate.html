<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加候选人 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
    <style>
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: #fafafa;
        }
        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
        }
        #upload-progress { display: none; margin-top: 24px; }
        #upload-results { display: none; margin-top: 16px; }
        .upload-result {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .upload-result:last-child { border-bottom: 0; }
        .upload-result.success { color: #18794e; }
        .upload-result.failed { color: #c62828; }
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="max-width: 600px; margin: 0 auto; padding-top: 40px;">
                <h1 class="page-title" style="margin-bottom: 32px;">添加候选人 (AI解析)</h1>
                
                <div class="card">
                    <div class="form-group">
                        <label>投递职位</label>
                        <select id="modal-job-select" style="width:100%; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border-color); outline:none;">
                            <option value="" disabled selected>加载职位中...</option>
                        </select>
                    </div>

                    <p style="color:var(--text-secondary); font-size:14px; margin-bottom: 16px;">支持拖拽或点击上传，Aura 将自动提取结构化数据并存入数据库。</p>

                    <input type="file" id="resume-file" accept="application/pdf" multiple style="display:none;">
                    <div class="upload-area" onclick="handleUploadAreaClick()">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--primary-color)" style="opacity:0.8"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                        <div style="margin-top:16px; font-weight:500;">点击或拖拽 PDF 文件到此处</div>
                    </div>

                    <div id="upload-progress">
                        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
                            <span id="progress-text" style="color:var(--primary-color); font-weight:500;">正在解析中...</span>
                        </div>
                        <div style="width:100%; height:6px; background:#eee; border-radius:3px; overflow:hidden;">
                            <div id="progress-bar" style="width:0%; height:100%; background:var(--primary-color); transition:width 0.3s;"></div>
                        </div>
                    </div>
                    <div id="upload-results" class="card" style="padding: 0;"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=18"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            renderSidebar('candidates');
            renderHeader();
            await loadJobs();
            setupCustomSelects();
        });

        function setupCustomSelects() {
            document.querySelectorAll('.form-group select').forEach(select => {
                const wrapper = document.createElement('div');
                wrapper.className = 'custom-select-wrapper';
                select.parentNode.insertBefore(wrapper, select);
                wrapper.appendChild(select);
                select.classList.add('hidden-select');
                
                const trigger = document.createElement('div');
                trigger.className = 'custom-select-trigger placeholder';
                
                const span = document.createElement('span');
                const defaultOption = select.querySelector('option[disabled][selected]') || select.options[0];
                span.innerText = defaultOption ? defaultOption.innerText : '';
                
                trigger.appendChild(span);
                
                const iconContainer = document.createElement('div');
                iconContainer.style.display = 'flex';
                iconContainer.style.alignItems = 'center';
                iconContainer.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
                trigger.appendChild(iconContainer.firstChild);
                
                wrapper.appendChild(trigger);
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'custom-select-options';
                
                Array.from(select.options).forEach(option => {
                    if (option.disabled) return;
                    const optDiv = document.createElement('div');
                    optDiv.className = 'custom-option';
                    if(option.selected) optDiv.classList.add('selected');
                    optDiv.innerText = option.innerText;
                    optDiv.dataset.value = option.value;
                    
                    optDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        select.value = option.value;
                        span.innerText = option.innerText;
                        trigger.classList.remove('placeholder');
                        
                        wrapper.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                        optDiv.classList.add('selected');
                        
                        wrapper.classList.remove('open');
                        select.dispatchEvent(new Event('change'));
                    });
                    optionsDiv.appendChild(optDiv);
                });
                
                wrapper.appendChild(optionsDiv);
                
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = wrapper.classList.contains('open');
                    document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
                    if (!isOpen) wrapper.classList.add('open');
                });
            });
            
            document.addEventListener('click', () => {
                document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
            });
        }

        async function loadJobs() {
            try {
                const response = await fetch('/api/jobs');
                const jobs = await response.json();
                const select = document.getElementById('modal-job-select');
                select.innerHTML = '<option value="" disabled selected>请选择投递职位</option>';
                jobs.forEach(job => {
                    if (job.status === '热招中') {
                        select.innerHTML += `<option value="${job.id}">${job.title}</option>`;
                    }
                });
            } catch (e) {
                console.error('Failed to load jobs', e);
                const select = document.getElementById('modal-job-select');
                select.innerHTML = '<option value="" disabled selected>网络错误，无法加载职位</option>';
            }
        }
        
        function handleUploadAreaClick() {
            const jobId = document.getElementById('modal-job-select').value;
            if (!jobId) {
                showToast("请先选择投递职位", "error");
                return;
            }
            document.getElementById('resume-file').click();
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character]));
        }

        document.getElementById('resume-file').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            document.getElementById('upload-progress').style.display = 'block';
            document.getElementById('upload-results').style.display = 'none';
            document.getElementById('upload-results').innerHTML = '';
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            progressBar.style.width = '30%';
            progressText.innerText = `正在上传 ${files.length} 份简历...`;

            const formData = new FormData();
            const jobId = document.getElementById('modal-job-select').value;
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const operatorName = user.name || '系统';

            files.forEach(file => formData.append("files", file));
            formData.append("job_id", jobId);
            formData.append("operator", operatorName);

            try {
                progressBar.style.width = '60%';
                progressText.innerText = `AI 正在解析 ${files.length} 份简历...`;
                
                const response = await fetch('/api/parse-resumes', {
                    method: 'POST',
                    body: formData
                });
                
                if(!response.ok) {
                    const errorBody = await response.json().catch(() => ({}));
                    throw new Error(errorBody.detail || `API 返回错误状态: ${response.status}`);
                }
                
                const batchResult = await response.json();
                const resultBox = document.getElementById('upload-results');
                resultBox.style.display = 'block';
                resultBox.innerHTML = batchResult.results.map(item => {
                    const filename = escapeHtml(item.filename || '未命名文件');
                    const candidateName = escapeHtml(item.candidate?.name || item.filename || '未命名候选人');
                    const detail = escapeHtml(item.detail || '未知错误');
                    const label = item.status === 'success'
                        ? `解析成功：${candidateName}`
                        : `解析失败：${detail}`;
                    return `<div class="upload-result ${item.status}">
                        <span>${item.status === 'success' ? '✓' : '×'}</span>
                        <span><strong>${filename}</strong><br>${label}</span>
                    </div>`;
                }).join('');

                progressBar.style.width = '100%';
                progressText.innerText = `处理完成：成功 ${batchResult.succeeded} 份，失败 ${batchResult.failed} 份`;

                const firstSuccess = batchResult.results.find(item => item.status === 'success');
                if (firstSuccess && firstSuccess.candidate) {
                    try {
                        sessionStorage.setItem('last_parsed_candidate', JSON.stringify(firstSuccess.candidate));
                    } catch(err) {
                        console.warn('sessionStorage not available', err);
                    }
                }

            } catch (error) {
                console.error(error);
                showToast(error.message || "解析失败，请确保后端服务正在运行。", "error");
                progressBar.style.width = '0%';
                document.getElementById('upload-progress').style.display = 'none';
            }
            
            e.target.value = '';
        });
    </script>
</body>
</html>
