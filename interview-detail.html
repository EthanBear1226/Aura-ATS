<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>面试详情 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=20">
    <style>
        .detail-page { max-width: 1180px; margin: 0 auto; padding: 22px 0 48px; }
        .detail-topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
        .back-link { color:var(--text-secondary); text-decoration:none; font-size:14px; }
        .back-link:hover { color:var(--primary-color); }
        .detail-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding:22px 24px; background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; }
        .eyebrow { color:var(--text-secondary); font-size:12px; margin-bottom:7px; }
        .detail-heading h1 { margin:0; font-size:26px; }
        .detail-heading p { margin:8px 0 0; color:var(--text-secondary); font-size:14px; }
        .status { display:inline-flex; align-items:center; padding:5px 10px; border-radius:999px; background:#eef6ff; color:var(--primary-color); font-size:12px; white-space:nowrap; }
        .status.done { background:#eff9f1; color:#18794e; }
        .status.cancelled { background:#fff1f0; color:#d4380d; }
        .detail-grid { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(300px, .75fr); gap:16px; margin-top:16px; }
        .panel { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:20px; }
        .panel h2 { margin:0 0 16px; font-size:17px; }
        .info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 20px; }
        .info-item label { display:block; color:var(--text-secondary); font-size:12px; margin-bottom:5px; }
        .info-item div { font-size:14px; line-height:1.5; word-break:break-word; }
        .candidate-summary { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
        .avatar { width:48px; height:48px; border-radius:50%; background:var(--primary-color); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; flex:none; }
        .candidate-summary h3 { margin:0; font-size:18px; }
        .candidate-summary p { margin:5px 0 0; color:var(--text-secondary); font-size:13px; }
        .skill-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
        .skill { padding:4px 9px; border-radius:999px; background:#f3f6fa; color:var(--text-secondary); font-size:12px; }
        .resume-box { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:13px 14px; border:1px solid var(--border-color); border-radius:7px; background:#fafbfc; }
        .resume-box strong { display:block; font-size:14px; }
        .resume-box span { display:block; color:var(--text-secondary); font-size:12px; margin-top:4px; }
        .feedback-summary { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
        .score { text-align:center; padding:10px 6px; background:#fafbfc; border:1px solid var(--border-color); border-radius:7px; }
        .score strong { display:block; font-size:18px; }
        .score span { display:block; margin-top:3px; color:var(--text-secondary); font-size:11px; }
        .feedback-copy { white-space:pre-wrap; line-height:1.65; color:var(--text-primary); font-size:14px; }
        .muted { color:var(--text-secondary); font-size:13px; }
        .revision-list { display:grid; gap:10px; }
        .revision { padding:12px 14px; background:#fafbfc; border:1px solid var(--border-color); border-radius:7px; }
        .revision-header { display:flex; justify-content:space-between; gap:12px; color:var(--text-secondary); font-size:12px; margin-bottom:7px; }
        .action-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .error-state { padding:56px 20px; text-align:center; color:var(--text-secondary); }
        .loading { padding:50px 20px; text-align:center; color:var(--text-secondary); }
        .feedback-editor { border-top:1px solid var(--border-color); margin-top:20px; padding-top:20px; }
        .feedback-editor fieldset { border:0; margin:0; padding:0; min-width:0; }
        .feedback-editor label { display:block; font-size:13px; margin-bottom:8px; }
        .feedback-editor textarea { width:100%; min-height:130px; resize:vertical; font:inherit; line-height:1.6; }
        .result-options { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 18px; }
        .result-options label { cursor:pointer; padding:8px 12px; border:1px solid var(--border-color); border-radius:6px; }
        .result-options label:has(input:checked) { border-color:var(--primary-color); background:#eef6ff; }
        .editor-scores { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
        .editor-scores select { width:100%; min-height:38px; }
        .form-message { margin:12px 0; font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
        .form-message.error { color:#d4380d; }
        .form-message.success { color:#18794e; }
        .panel, .detail-heading, .action-row { min-width:0; overflow-wrap:anywhere; }
        .detail-topbar { flex-wrap:wrap; }
        [hidden] { display:none !important; }
        .resume-section { grid-column:1 / -1; padding:20px 0; border-top:1px solid var(--border-color); }
        .resume-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
        .resume-toolbar h2 { font-size:17px; margin:0; }
        .resume-frame { display:block; width:100%; height:640px; max-height:75vh; border:1px solid var(--border-color); background:#fff; }
        .resume-message { padding:18px 0; font-size:14px; color:var(--text-secondary); }
        @media (max-width:600px) { .resume-frame { height:500px; } .resume-box { flex-wrap:wrap; } }
        @media (max-width: 900px) { .detail-grid { grid-template-columns:1fr; } }
        @media (max-width: 600px) { .detail-heading { display:block; } .detail-heading .status { margin-top:14px; } .info-grid { grid-template-columns:1fr; } .feedback-summary { grid-template-columns:repeat(3,minmax(0,1fr)); } .detail-page { padding:16px 0 32px; } }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="detail-page">
                <div id="pageState" class="loading">正在加载面试详情...</div>
                <div id="detailContent" style="display:none;">
                    <div class="detail-topbar">
                        <a class="back-link" href="interviewer-workbench.html?v=20">← 返回我的面试</a>
                        <div class="action-row">
                            <a class="btn" id="scheduleLink" href="interviews.html?v=20">查看面试日程</a>
                            <button class="btn btn-primary" id="feedbackButton" type="button">填写面试反馈</button>
                        </div>
                    </div>
                    <section class="detail-heading">
                        <div>
                            <div class="eyebrow">面试详情</div>
                            <h1 id="candidateName">--</h1>
                            <p id="headingMeta">--</p>
                        </div>
                        <span class="status" id="statusBadge">--</span>
                    </section>

                    <div class="detail-grid">
                        <div class="panel">
                            <h2>候选人摘要</h2>
                            <div class="candidate-summary">
                                <div class="avatar" id="candidateAvatar">--</div>
                                <div>
                                    <h3 id="candidateSummaryName">--</h3>
                                    <p id="candidateSummaryMeta">--</p>
                                </div>
                            </div>
                            <div class="info-grid">
                                <div class="info-item"><label>应聘职位</label><div id="candidateJob">--</div></div>
                                <div class="info-item"><label>工作经验</label><div id="candidateExp">--</div></div>
                                <div class="info-item"><label>候选人阶段</label><div id="candidateStage">--</div></div>
                                <div class="info-item"><label>联系方式</label><div id="candidateContact">仅 HR 可查看</div></div>
                            </div>
                            <div class="skill-list" id="skillList"></div>
                            <div class="resume-box" style="margin-top:18px;">
                                <div><strong>候选人简历</strong><span id="resumeHint">仅展示当前面试所需的简历入口</span></div>
                                <button class="btn" id="resumeLink" type="button" aria-controls="resumeSection" aria-expanded="false" hidden>预览简历</button>
                            </div>
                        </div>

                        <div class="panel">
                            <h2>面试安排</h2>
                            <div class="info-grid">
                                <div class="info-item"><label>面试职位</label><div id="interviewJob">--</div></div>
                                <div class="info-item"><label>面试官</label><div id="interviewerName">--</div></div>
                                <div class="info-item"><label>开始时间</label><div id="startTime">--</div></div>
                                <div class="info-item"><label>结束时间</label><div id="endTime">--</div></div>
                                <div class="info-item"><label>面试地点</label><div id="location">--</div></div>
                                <div class="info-item"><label>反馈修改次数</label><div id="revisionCount">0 / 2</div></div>
                            </div>
                        </div>

                        <section class="resume-section" id="resumeSection" hidden aria-label="候选人简历预览">
                            <div class="resume-toolbar">
                                <h2>候选人简历</h2>
                                <div class="action-row">
                                    <a class="btn" id="openResume" target="_blank" rel="noopener" hidden>单独打开</a>
                                    <a class="btn" id="downloadResume" download="resume.pdf" hidden>下载简历</a>
                                    <button class="btn" id="closeResume" type="button">收起简历</button>
                                </div>
                            </div>
                            <div class="resume-message" id="resumeMessage" role="status" aria-live="polite"></div>
                            <button class="btn" id="retryResume" type="button" hidden>重新加载</button>
                            <iframe class="resume-frame" id="resumeFrame" title="候选人 PDF 简历" hidden></iframe>
                        </section>
                        <div class="panel" id="feedbackPanel">
                            <h2>当前反馈</h2>
                            <p class="muted" id="feedbackPolicy"></p>
                            <div id="feedbackEmpty" class="muted">本场面试尚未提交反馈。</div>
                            <div id="feedbackContent" style="display:none;">
                                <div class="info-item"><label>综合结论</label><div id="feedbackResult">--</div></div>
                                <div class="feedback-summary" style="margin-top:14px;">
                                    <div class="score"><strong id="professionalScore">-</strong><span>专业能力</span></div>
                                    <div class="score"><strong id="communicationScore">-</strong><span>沟通表达</span></div>
                                    <div class="score"><strong id="businessScore">-</strong><span>业务理解</span></div>
                                    <div class="score"><strong id="collaborationScore">-</strong><span>协作能力</span></div>
                                    <div class="score"><strong id="potentialScore">-</strong><span>发展潜力</span></div>
                                </div>
                                <div class="info-item" style="margin-top:16px;"><label>详细反馈</label><div class="feedback-copy" id="feedbackText">--</div></div>
                                <div class="info-item" style="margin-top:16px;"><label>面试官笔记</label><div class="feedback-copy" id="interviewerNotes">--</div></div>
                                <div class="muted" style="margin-top:14px;" id="feedbackUpdatedAt">--</div>
                            </div>
                            <div id="submitMessage" class="form-message" role="status" aria-live="polite"></div>
                            <form id="feedbackForm" class="feedback-editor" hidden>
                                <fieldset id="feedbackFields">
                                    <legend>综合结论</legend>
                                    <div class="result-options">
                                        <label><input type="radio" name="result" value="满意" required> 满意</label>
                                        <label><input type="radio" name="result" value="待定"> 待定</label>
                                        <label><input type="radio" name="result" value="不满意"> 不满意</label>
                                    </div>
                                    <div class="editor-scores" id="editorScores"></div>
                                    <label for="editorFeedback">详细反馈</label>
                                    <textarea id="editorFeedback" class="form-control" required></textarea>
                                    <label for="editorNotes" style="margin-top:16px;">面试官笔记</label>
                                    <textarea id="editorNotes" class="form-control"></textarea>
                                    <div class="action-row" style="margin-top:16px;">
                                        <button type="submit" class="btn btn-primary" id="submitFeedbackButton">提交反馈</button>
                                        <button type="button" class="btn" id="cancelEditButton">取消编辑</button>
                                    </div>
                                </fieldset>
                            </form>
                        </div>

                        <div class="panel">
                            <h2>反馈历史</h2>
                            <div id="revisionList" class="revision-list"><div class="muted">暂无历史版本。</div></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/app.js?v=20"></script>
    <script>
        let interview = null;
        let revisions = [];
        let saving = false;
        let dirty = false;
        let historyFailed = false;
        let resumeUrl = null;
        let resumeLoading = false;
        const scoreFields = [['professional', '专业能力'], ['communication', '沟通表达'], ['business', '业务理解'], ['collaboration', '协作能力'], ['potential', '发展潜力']];
        const currentUser = JSON.parse(localStorage.getItem('aura_user') || '{}');

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            if (!['Interviewer', 'Recruiter', 'Admin', 'SuperAdmin'].includes(user.role)) {
                window.location.replace('index.html');
                return;
            }
            renderSidebar('interviewer-workbench');
            renderHeader();
            if (user.role !== 'Interviewer') {
                document.querySelector('.back-link').href = 'interviews.html';
                document.querySelector('.back-link').textContent = '返回面试日程';
            }
            document.getElementById('editorScores').innerHTML = scoreFields.map(([key, label]) => `<label for="editor-${key}">${label}<select id="editor-${key}" class="form-control" required><option value="">请选择</option>${[1, 2, 3, 4, 5].map(score => `<option value="${score}">${score} 分</option>`).join('')}</select></label>`).join('');
            document.getElementById('feedbackForm').addEventListener('submit', submitFeedback);
            document.getElementById('feedbackForm').addEventListener('input', () => { dirty = true; });
            document.getElementById('cancelEditButton').onclick = () => {
                if (dirty && !window.confirm('放弃尚未提交的修改？')) return;
                dirty = false;
                document.getElementById('feedbackForm').hidden = true;
            };
            window.addEventListener('beforeunload', event => {
                if (dirty || saving) { event.preventDefault(); event.returnValue = ''; }
            });
            loadDetail();
            document.getElementById('resumeLink').onclick = previewResume;
            document.getElementById('retryResume').onclick = previewResume;
            document.getElementById('closeResume').onclick = () => {
                document.getElementById('resumeSection').hidden = true;
                document.getElementById('resumeLink').setAttribute('aria-expanded', 'false');
                document.getElementById('resumeLink').focus();
            };
            window.addEventListener('pagehide', event => { if (!event.persisted && resumeUrl) URL.revokeObjectURL(resumeUrl); });
        });

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[character]));
        }

        function getInterviewId() {
            return new URLSearchParams(window.location.search).get('id');
        }

        function formatDateTime(value) {
            if (!value) return '--';
            return new Date(value).toLocaleString('zh-CN', {
                year: 'numeric', month: 'numeric', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        async function loadDetail() {
            const id = getInterviewId();
            if (!id) return showError('缺少面试编号，无法打开详情。');
            try {
                const response = await fetch(`/api/interviews/${encodeURIComponent(id)}`);
                if (response.status === 403) return showError('你无权查看这场面试。');
                if (response.status === 404) return showError('这场面试不存在或已被删除。');
                if (!response.ok) throw new Error('interview detail failed');
                interview = await response.json();

                await loadRevisions();
                renderDetail();
            } catch (error) {
                console.error(error);
                showError('面试详情加载失败，请稍后重试。');
            }
        }

        function showError(message) {
            document.getElementById('pageState').className = 'error-state';
            document.getElementById('pageState').innerText = message;
        }

        function renderDetail() {
            const c = interview.candidate || {};
            document.getElementById('pageState').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';
            document.getElementById('candidateName').innerText = c.name || '未知候选人';
            document.getElementById('headingMeta').innerText = `${interview.job_title || c.job || '--'} · ${formatDateTime(interview.start_time)}`;
            document.getElementById('candidateAvatar').innerText = (c.name || '?').slice(0, 1);
            document.getElementById('candidateSummaryName').innerText = c.name || '未知候选人';
            document.getElementById('candidateSummaryMeta').innerText = `${c.job || interview.job_title || '--'} · ${c.exp || '经验未填写'}`;
            document.getElementById('candidateJob').innerText = c.job || interview.job_title || '--';
            document.getElementById('candidateExp').innerText = c.exp || '--';
            document.getElementById('candidateStage').innerText = c.stage || '--';
            document.getElementById('interviewJob').innerText = interview.job_title || '--';
            document.getElementById('interviewerName').innerText = interview.interviewer_name || '--';
            document.getElementById('startTime').innerText = formatDateTime(interview.start_time);
            document.getElementById('endTime').innerText = formatDateTime(interview.end_time);
            document.getElementById('location').innerText = interview.location || '线上面试';
            document.getElementById('revisionCount').innerText = `${interview.feedback_revision_count || 0} / 2`;

            const statusBadge = document.getElementById('statusBadge');
            statusBadge.innerText = interview.feedback_result ? `已评价：${interview.feedback_result}` : (interview.status || '已安排');
            statusBadge.className = `status ${interview.feedback_result ? 'done' : (interview.status === '已取消' ? 'cancelled' : '')}`;
            const skillList = document.getElementById('skillList');
            skillList.innerHTML = Array.isArray(c.skills) && c.skills.length
                ? c.skills.slice(0, 12).map(skill => `<span class="skill">${escapeHtml(skill)}</span>`).join('')
                : '<span class="muted">暂无技能标签</span>';

            if (c.pdf_path) {
                const link = document.getElementById('resumeLink');
                link.hidden = false;
                document.getElementById('resumeHint').innerText = 'PDF 简历';
            } else {
                document.getElementById('resumeHint').innerText = '当前没有可预览的简历文件';
            }

            const feedbackButton = document.getElementById('feedbackButton');
            const canEdit = canEditFeedback();
            document.getElementById('feedbackPolicy').textContent = feedbackPolicy();
            feedbackButton.innerText = interview.feedback_result ? (canEdit ? '修改面试反馈' : '查看面试反馈') : '填写面试反馈';
            feedbackButton.onclick = () => {
                if (canEdit) openFeedbackEditor();
                document.getElementById('feedbackPanel').scrollIntoView({ behavior:'smooth', block:'start' });
            };
            renderFeedback();
            renderRevisions();
        }

        async function previewResume() {
            const section = document.getElementById('resumeSection');
            section.hidden = false;
            document.getElementById('resumeLink').setAttribute('aria-expanded', 'true');
            section.scrollIntoView({behavior:'smooth', block:'start'});
            if (resumeUrl || resumeLoading) return;
            resumeLoading = true;
            const message = document.getElementById('resumeMessage');
            const retry = document.getElementById('retryResume');
            retry.hidden = true;
            message.textContent = '正在加载简历…';
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            try {
                const response = await fetch(`/api/interviews/${encodeURIComponent(interview.id)}/resume`, {signal:controller.signal});
                if (!response.ok) {
                    const errors = {403:'你无权查看本场面试的简历。', 404:'简历文件不存在，请联系 HR 补充。', 415:'文件不是有效的 PDF，请联系 HR 重新上传。'};
                    throw new Error(errors[response.status] || '简历加载失败，请重试。');
                }
                const blob = await response.blob();
                const header = await blob.slice(0, 5).text();
                if (header !== '%PDF-') throw new Error('文件不是有效的 PDF，请联系 HR 重新上传。');
                resumeUrl = URL.createObjectURL(new Blob([blob], {type:'application/pdf'}));
                const frame = document.getElementById('resumeFrame');
                frame.src = `${resumeUrl}#navpanes=0&view=FitH`;
                frame.hidden = navigator.pdfViewerEnabled === false;
                message.textContent = frame.hidden ? '浏览器不支持内嵌 PDF，请单独打开或下载简历。' : '若预览未显示，可单独打开或下载简历。';
                for (const id of ['openResume', 'downloadResume']) {
                    document.getElementById(id).href = resumeUrl;
                    document.getElementById(id).hidden = false;
                }
            } catch (error) {
                message.textContent = error.name === 'AbortError' ? '简历加载超时，请重试。' : (error.message || '简历加载失败，请重试。');
                retry.hidden = false;
            } finally {
                clearTimeout(timeout);
                resumeLoading = false;
            }
        }

        function renderFeedback() {
            const hasFeedback = Boolean(interview.feedback_result);
            document.getElementById('feedbackEmpty').style.display = hasFeedback ? 'none' : 'block';
            document.getElementById('feedbackContent').style.display = hasFeedback ? 'block' : 'none';
            if (!hasFeedback) return;
            document.getElementById('feedbackResult').innerText = interview.feedback_result;
            document.getElementById('professionalScore').innerText = interview.professional_score ?? '-';
            document.getElementById('communicationScore').innerText = interview.communication_score ?? '-';
            document.getElementById('businessScore').innerText = interview.business_score ?? '-';
            document.getElementById('collaborationScore').innerText = interview.collaboration_score ?? '-';
            document.getElementById('potentialScore').innerText = interview.potential_score ?? '-';
            document.getElementById('feedbackText').innerText = interview.feedback_text || '暂无详细反馈';
            document.getElementById('interviewerNotes').innerText = interview.interviewer_notes || '暂无面试官笔记';
            document.getElementById('feedbackUpdatedAt').innerText = `最近更新：${formatDateTime(interview.feedback_updated_at || interview.feedback_submitted_at)}`;
        }

        function canEditFeedback() {
            return currentUser.role === 'Interviewer' && currentUser.name === interview.interviewer_name
                && interview.status !== '已取消'
                && !['已淘汰', '已归档'].includes(interview.candidate?.stage)
                && (!interview.feedback_result || (interview.feedback_revision_count || 0) < 2);
        }

        function feedbackPolicy() {
            if (interview.status === '已取消') return '面试已取消，反馈仅供查看。';
            if (['已淘汰', '已归档'].includes(interview.candidate?.stage)) return '候选人流程已中止，反馈仅供查看。';
            if (currentUser.role !== 'Interviewer') return '反馈仅供查看。';
            if (interview.feedback_result && (interview.feedback_revision_count || 0) >= 2) return '已用完 2 次修改机会，反馈仅供查看。';
            return interview.feedback_result ? `剩余修改次数：${2 - (interview.feedback_revision_count || 0)}` : '提交后最多可修改 2 次。';
        }

        function openFeedbackEditor() {
            if (saving || !canEditFeedback()) return;
            const form = document.getElementById('feedbackForm');
            if (!form.hidden) return;
            form.querySelectorAll('input[name="result"]').forEach(input => { input.checked = input.value === interview.feedback_result; });
            scoreFields.forEach(([key]) => { document.getElementById(`editor-${key}`).value = interview[`${key}_score`] ?? ''; });
            document.getElementById('editorFeedback').value = interview.feedback_text || '';
            document.getElementById('editorNotes').value = interview.interviewer_notes || '';
            document.getElementById('submitFeedbackButton').textContent = interview.feedback_result ? '保存修改' : '提交反馈';
            form.hidden = false;
            dirty = false;
        }

        async function loadRevisions() {
            try {
                const id = interview.id;
                const response = await fetch(`/api/interviews/${encodeURIComponent(id)}/feedback-revisions`);
                if (!response.ok) throw new Error('history failed');
                revisions = await response.json();
                historyFailed = false;
            } catch {
                historyFailed = true;
            }
        }

        async function submitFeedback(event) {
            event.preventDefault();
            if (saving || !canEditFeedback()) return;
            const form = document.getElementById('feedbackForm');
            if (!form.reportValidity()) return;
            const message = document.getElementById('submitMessage');
            const text = document.getElementById('editorFeedback').value.trim();
            if (!text) {
                message.className = 'form-message error';
                message.textContent = '请填写详细反馈，不能仅包含空格。';
                document.getElementById('editorFeedback').focus();
                return;
            }
            const result = form.querySelector('input[name="result"]:checked').value;
            let confirmed = false;
            if (result === '不满意') {
                confirmed = window.confirm('确认淘汰该候选人？确认后候选人将自动归档，其他已安排面试将取消，后续流程中止，当前反馈将转为只读。');
                if (!confirmed) return;
            }
            const payload = {
                feedback_result: result, feedback_text: text,
                interviewer_notes: document.getElementById('editorNotes').value,
                confirm_rejection: confirmed,
                ...Object.fromEntries(scoreFields.map(([key]) => [`${key}_score`, Number(document.getElementById(`editor-${key}`).value)]))
            };
            saving = true;
            document.getElementById('feedbackFields').disabled = true;
            document.getElementById('feedbackButton').disabled = true;
            message.className = 'form-message';
            message.textContent = '正在提交反馈…';
            try {
                const response = await fetch(`/api/interviews/${encodeURIComponent(interview.id)}/feedback`, {
                    method:'PATCH', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload)
                });
                if (!response.ok) {
                    const body = await response.json().catch(() => ({}));
                    const errors = {
                        'Feedback can only be modified twice': '已用完 2 次修改机会。',
                        'Candidate process has ended; feedback is read-only': '候选人流程已中止，反馈仅供查看。',
                        'Cancelled interviews cannot receive feedback': '面试已取消，无法提交反馈。',
                        'Only the assigned interviewer can submit feedback': '仅被指派的面试官可以提交反馈。'
                    };
                    throw new Error(errors[body.detail] || '提交失败，请稍后重试。已填写内容已保留。');
                }
                interview = await response.json();
                dirty = false;
                form.hidden = true;
                renderDetail();
                message.className = 'form-message success';
                message.textContent = '反馈已保存。';
                await loadRevisions();
                renderRevisions();
            } catch (error) {
                message.className = 'form-message error';
                message.textContent = error.message || '网络异常，请重试。已填写内容已保留。';
            } finally {
                saving = false;
                document.getElementById('feedbackFields').disabled = false;
                document.getElementById('feedbackButton').disabled = false;
            }
        }

        function renderRevisions() {
            const container = document.getElementById('revisionList');
            if (historyFailed) {
                container.innerHTML = '<div class="muted">反馈历史加载失败。</div><button type="button" class="btn" id="retryHistory">重试</button>';
                document.getElementById('retryHistory').onclick = async () => { await loadRevisions(); renderRevisions(); };
                return;
            }
            if (!revisions.length) {
                container.innerHTML = '<div class="muted">暂无历史版本。</div>';
                return;
            }
            container.innerHTML = revisions.slice().reverse().map(revision => `
                <div class="revision">
                    <div class="revision-header">
                        <span>第 ${revision.revision_number + 1} 个版本 · ${revision.action === 'updated' ? '修改' : '首次提交'}</span>
                        <span>${escapeHtml(formatDateTime(revision.created_at))}</span>
                    </div>
                    <div><strong>${escapeHtml(revision.feedback_result || '--')}</strong> · 平均评分 ${averageScore(revision)} / 5</div>
                    <div class="muted" style="margin-top:5px;">${escapeHtml(revision.feedback_text || '暂无文字反馈')}</div>
                </div>
            `).join('');
        }

        function averageScore(revision) {
            const scores = ['professional_score', 'communication_score', 'business_score', 'collaboration_score', 'potential_score']
                .map(key => revision[key]).filter(value => Number.isInteger(value) && value >= 1 && value <= 5);
            return scores.length ? (scores.reduce((sum, value) => sum + value, 0) / scores.length).toFixed(1) : '--';
        }
    </script>
</body>
</html>
