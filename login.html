<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - 灵犀招聘 | 登录</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-logo">Aura</div>
            <div class="auth-subtitle">智能招聘管理系统</div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="工作邮箱" required value="hr@example.com">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码" required value="123456">
                </div>
                <div id="error-msg-box" style="color: #ff4d4f; font-size: 13px; margin-top: 12px; background: #fff2f0; border: 1px solid #ffccc7; padding: 8px 12px; border-radius: 6px; display: none; text-align: center;"></div>

                <button type="submit" class="btn btn-primary" style="margin-top:16px;">登录</button>
            </form>
            
            <div class="auth-links">
                还没有账号？ <a href="register.html">免费注册</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg-box');
            
            if (errorBox) {
                errorBox.style.display = 'none';
                errorBox.innerText = '';
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = '正在登录...';
            btn.disabled = true;
            
            try {
                let response = null;
                try {
                    response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                } catch(err1) {
                    btn.innerText = '正在尝试连接...';
                    await new Promise(r => setTimeout(r, 1000));
                    response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                }
                
                if (response && response.ok) {
                    window.loginSuccessful = true;
                    const data = await response.json();
                    localStorage.setItem('aura_token', data.access_token);
                    localStorage.setItem('aura_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else if (response) {
                    const err = await response.json();
                    const msg = err.detail || '邮箱或密码错误，请重新输入';
                    if (errorBox) {
                        errorBox.innerText = msg;
                        errorBox.style.display = 'block';
                    }
                } else {
                    throw new Error("No response");
                }
            } catch (error) {
                console.error(error);
                if (!localStorage.getItem('aura_token') && !window.loginSuccessful) {
                    if (errorBox) {
                        errorBox.innerText = '网络连接暂时繁忙，请重新点击登录';
                        errorBox.style.display = 'block';
                    }
                }
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
