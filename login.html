<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - 灵犀招聘 | 登录</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-logo">Aura</div>
            <div class="auth-subtitle">智能招聘管理系统</div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="工作邮箱" required value="hr@example.com">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码" required value="123456">
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            
            <div class="auth-links">
                还没有账号？ <a href="register.html">免费注册</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Mock authentication
            localStorage.setItem('aura_user', JSON.stringify({ name: 'HR Manager', email: 'hr@example.com' }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
