<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - 灵犀招聘 | 登录</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-logo">Aura</div>
            <div class="auth-subtitle">智能招聘管理系统</div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="工作邮箱" required value="hr@example.com">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码" required value="123456">
                </div>
                <div id="error-msg-box" style="color: #ff4d4f; font-size: 13px; margin-top: 12px; background: #fff2f0; border: 1px solid #ffccc7; padding: 8px 12px; border-radius: 6px; display: none; text-align: center;"></div>

                <button type="submit" class="btn btn-primary" style="margin-top:16px;">登录</button>
            </form>
            
            <div class="auth-links">
                还没有账号？ <a href="register.html">免费注册</a>
            </div>
        </div>
    </div>
    
    <script>
        // 1. 页面加载瞬间静默预热后端服务，彻底消除冷启动延时
        try {
            fetch('/api/candidates', { method: 'GET' }).catch(() => {});
        } catch(e) {}

        // 2. 登录表单提交 (全自动平滑自愈重试，一次点击直接秒进)
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg-box');
            
            if (errorBox) {
                errorBox.style.display = 'none';
                errorBox.innerText = '';
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = '正在登录...';
            btn.disabled = true;
            
            let response = null;
            let lastError = null;

            // 自动最多尝试 3 次，平滑自愈连接
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    
                    response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    // 如果拿到正常响应或者密码错误等业务状态，直接跳出重试循环
                    if (response) {
                        break;
                    }
                } catch (err) {
                    lastError = err;
                    if (attempt < 3) {
                        btn.innerText = `正在连接 (${attempt}/3)...`;
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
            }

            try {
                if (response && response.ok) {
                    window.loginSuccessful = true;
                    const data = await response.json();
                    localStorage.setItem('aura_token', data.access_token);
                    localStorage.setItem('aura_user', JSON.stringify(data.user));
                    btn.innerText = '登录成功，正在跳转...';
                    window.location.href = 'index.html';
                    return;
                } else if (response) {
                    const err = await response.json();
                    const msg = err.detail || '邮箱或密码错误，请重新输入';
                    if (errorBox) {
                        errorBox.innerText = msg;
                        errorBox.style.display = 'block';
                    }
                } else {
                    if (errorBox) {
                        errorBox.innerText = '网络连接暂时繁忙，请稍候重试';
                        errorBox.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error(error);
                if (errorBox) {
                    errorBox.innerText = '网络连接异常，请重试';
                    errorBox.style.display = 'block';
                }
            } finally {
                if (!window.loginSuccessful) {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }
        });
    </script>

</body>
</html>
