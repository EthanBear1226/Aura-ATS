<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - 灵犀招聘 | 注册</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-logo">Aura</div>
            <div class="auth-subtitle">注册您的企业空间</div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <input type="text" id="company" placeholder="企业名称" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="工作邮箱" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="设置密码" required>
                </div>
                <button type="submit" class="btn btn-primary">注册并进入工作台</button>
            </form>
            
            <div class="auth-links">
                已有账号？ <a href="login.html">返回登录</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const company = document.getElementById('company').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = '正在注册...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        company: company,
                        email: email,
                        password: password,
                        name: '企业管理员',
                        role: 'SuperAdmin'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('aura_token', data.access_token);
                    localStorage.setItem('aura_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    const err = await response.json();
                    alert(err.detail || '注册失败，该工作邮箱可能已被注册');
                }
            } catch (error) {
                console.error(error);
                alert('网络异常，请检查后端服务是否正常启动');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
