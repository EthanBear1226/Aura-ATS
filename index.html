<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header" id="header-container"></header>

            <!-- Page Content -->
            <div class="page-content">
                <header class="workbench-header">
                    <h1 class="page-title" id="workbench-welcome">加载中...</h1>
                </header>
                
                <!-- Bento Grid Workbench -->
                <div class="bento-grid" id="workbench-grid">
                    <!-- 磁贴将由 JS 动态渲染 -->
                    <div style="grid-column: span 12; padding: 100px; text-align: center; color: var(--text-secondary);">
                        正在准备您的工作台...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=11"></script>
    <script>
        // Init global layout components
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('index');
            renderHeader();
            fetchDashboardData();
        });

        async function fetchDashboardData() {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'HR';
            const name = user.name || '系统';
            
            document.getElementById('workbench-welcome').innerText = `欢迎回来，${name} (${role})`;

            try {
                const response = await fetch(`/api/workbench/dashboard?role=${role}&name=${name}`);
                const data = await response.json();
                renderWorkbench(data);
            } catch (error) {
                console.error("加载工作台失败:", error);
            }
        }

        function renderWorkbench(data) {
            const grid = document.getElementById('workbench-grid');
            grid.innerHTML = '';

            // 1. 统计磁贴 (Stats)
            data.stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.style.padding = '20px';
                card.innerHTML = `
                    <div style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">${stat.label}</div>
                    <div style="font-size: 32px; font-weight: 700; margin: 10px 0;">${stat.value}</div>
                    <div style="font-size: 12px; color: var(--primary-color);">${stat.trend}</div>
                `;
                grid.appendChild(card);
            });

            // 2. 主待办区域 (Todos) - 占据两列
            const todoCard = document.createElement('div');
            todoCard.className = 'glass-card';
            todoCard.style.padding = '24px';
            todoCard.style.gridColumn = window.innerWidth > 1024 ? 'span 2' : 'span 1';
            todoCard.style.gridRow = 'span 2';
            
            let todoItems = data.todos.map(todo => `
                <div class="task-item" onclick="window.location.href='candidate-detail.html?id=${todo.target_id}'" style="cursor:pointer; background:rgba(255,255,255,0.5); border-radius:14px; margin-bottom:12px; padding:16px; border: 1px solid rgba(255,255,255,0.3);">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div style="width:10px; height:10px; border-radius:5px; background:${todo.priority === 'high' ? 'var(--danger-color)' : 'var(--primary-color)'}"></div>
                        <div style="flex:1;">
                            <div style="font-weight:600;">${todo.title}</div>
                            <div style="font-size:13px; color:var(--text-secondary);">${todo.subtitle}</div>
                        </div>
                        ${todo.time ? `<div style="font-weight:700; color:var(--text-primary);">${todo.time}</div>` : ''}
                    </div>
                </div>
            `).join('');

            todoCard.innerHTML = `
                <h3 style="margin-bottom:20px; font-size: 1.1rem; font-weight: 600;">待办事项</h3>
                ${todoItems || '<div style="text-align:center; color:var(--text-secondary); padding:40px; font-size: 14px;">暂无紧急待办</div>'}
            `;
            grid.appendChild(todoCard);

            // 3. 动态流 (Activities)
            const activityCard = document.createElement('div');
            activityCard.className = 'glass-card';
            activityCard.style.padding = '24px';
            activityCard.innerHTML = `
                <h3 style="margin-bottom:20px; font-size: 1.1rem; font-weight: 600;">团队动态</h3>
                <div style="display:flex; flex-direction:column; gap:16px;">
                    ${data.activities.map(a => `
                        <div style="font-size:13px;">
                            <div style="color:var(--text-primary); font-weight: 500;">${a.content}</div>
                            <div style="color:var(--text-secondary); font-size:11px; margin-top:4px;">${a.time}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            grid.appendChild(activityCard);
        }
    </script>
</body>
</html>
