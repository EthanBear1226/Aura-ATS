<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=2">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header" id="header-container"></header>

            <!-- Page Content -->
            <div class="page-content">
                <h1 class="page-title">工作台</h1>
                
                <!-- Metrics Grid -->
                <div class="dashboard-metrics">
                    <div class="card metric-card">
                        <div class="metric-title">今日新增简历</div>
                        <div class="metric-value">24</div>
                        <div class="metric-trend">↑ 12% 较昨日</div>
                    </div>
                    <div class="card metric-card">
                        <div class="metric-title">待处理面试</div>
                        <div class="metric-value">5</div>
                        <div class="metric-trend" style="color:var(--text-secondary)">与昨日持平</div>
                    </div>
                    <div class="card metric-card">
                        <div class="metric-title">本月发放 Offer</div>
                        <div class="metric-value">12</div>
                        <div class="metric-trend">↑ 30% 较上月</div>
                    </div>
                    <div class="card metric-card">
                        <div class="metric-title">在招职位数</div>
                        <div class="metric-value">8</div>
                        <div class="metric-trend" style="color:var(--text-secondary)">持续推进中</div>
                    </div>
                </div>

                <div class="dashboard-sections">
                    <!-- Tasks -->
                    <div class="card">
                        <h2 class="section-title">即将进行的面试</h2>
                        <div class="task-list">
                            <div class="task-item">
                                <div>
                                    <div style="font-weight: 500;">张三 - 高级前端工程师</div>
                                    <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">14:00 - 15:00 · 腾讯会议</div>
                                </div>
                                <span class="tag tag-blue">技术初面</span>
                            </div>
                            <div class="task-item">
                                <div>
                                    <div style="font-weight: 500;">李四 - 产品经理</div>
                                    <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">16:30 - 17:30 · 会议室 A</div>
                                </div>
                                <span class="tag tag-green">业务复面</span>
                            </div>
                        </div>
                    </div>

                    <!-- Jobs -->
                    <div class="card">
                        <h2 class="section-title">活跃职位进度</h2>
                        <div class="job-list">
                            <div class="job-item">
                                <div>
                                    <div style="font-weight: 500; font-size: 14px;">高级前端工程师</div>
                                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">研发部</div>
                                </div>
                                <div style="text-align: right; font-size: 12px; color: var(--text-secondary);">
                                    12 / 4 / 1 <br> <span style="font-size:10px">(简历/面试/Offer)</span>
                                </div>
                            </div>
                            <div class="job-item">
                                <div>
                                    <div style="font-weight: 500; font-size: 14px;">数据分析师</div>
                                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">增长团队</div>
                                </div>
                                <div style="text-align: right; font-size: 12px; color: var(--text-secondary);">
                                    35 / 8 / 0 <br> <span style="font-size:10px">(简历/面试/Offer)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=2"></script>
    <script>
        // Init global layout components
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('index');
            renderHeader();
        });
    </script>
</body>
</html>
