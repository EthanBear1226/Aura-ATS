<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试安排 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=15">
    <style>
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            margin-top: 32px;
            color: var(--text-primary);
        }
        .section-title:first-child {
            margin-top: 0;
        }
        .interview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .interview-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: var(--transition);
        }
        .interview-item:hover {
            box-shadow: var(--shadow-sm);
            border-color: #d0d0d5;
        }
        .interview-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .interview-col-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .interview-col-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .interview-actions {
            display: flex;
            gap: 8px;
            min-width: 100px;
            justify-content: flex-end;
        }
        @media (max-width: 768px) {
            .interview-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .interview-actions {
                width: 100%;
                justify-content: stretch;
            }
            .interview-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="padding-top:20px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                    <h1 class="page-title" style="margin:0;">面试安排</h1>
                </div>
                
                <div class="section-title">今天的面试</div>
                <div class="interview-list" id="list-today"></div>

                <div class="section-title">明天及之后的面试</div>
                <div class="interview-list" id="list-future"></div>

                <div class="section-title">之前的面试</div>
                <div class="interview-list" id="list-past"></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-card">
            <h2>面试评价反馈</h2>
            <input type="hidden" id="feedbackInterviewId">
            <div class="form-group">
                <label>面试结论</label>
                <select id="feedbackResult" class="form-control">
                    <option value="满意">满意 (推进)</option>
                    <option value="待定">待定 (观望)</option>
                    <option value="不满意">不满意 (淘汰)</option>
                </select>
            </div>
            <div class="form-group">
                <label>详细评价</label>
                <textarea id="feedbackText" class="form-control" style="height:150px;"></textarea>
            </div>
            <div style="display:flex; gap:12px; margin-top:24px;">
                <button class="btn" style="flex:1; justify-content:center;" onclick="closeFeedbackModal()">取消</button>
                <button class="btn btn-primary" id="btnSubmitFeedback" style="flex:1; justify-content:center;" onclick="submitFeedback()">提交评价</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js?v=10"></script>
    <script>
        let allInterviews = [];

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('interviews');
            renderHeader();
            loadInterviews();
        });

        async function loadInterviews() {
            try {
                const response = await fetch('/api/interviews');
                allInterviews = await response.json();
                renderList();
            } catch(e) { console.error(e); }
        }

        function renderList() {
            const listToday = document.getElementById('list-today');
            const listFuture = document.getElementById('list-future');
            const listPast = document.getElementById('list-past');
            
            listToday.innerHTML = '';
            listFuture.innerHTML = '';
            listPast.innerHTML = '';
            
            // Normalize current time to start of day for comparison
            const now = new Date();
            const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            // Sort interviews by date ascending
            allInterviews.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));
            
            let countToday = 0, countFuture = 0, countPast = 0;

            allInterviews.forEach(interview => {
                let btnHtml = '';

                if (interview.status === '已安排') {
                    btnHtml = `<button class="btn btn-primary" style="padding:6px 16px; font-size:13px;" onclick="openFeedbackModal(${interview.id})">填写评价</button>`;
                } else if (interview.status === '已完成') {
                    btnHtml = `<button class="btn" style="padding:6px 16px; font-size:13px;" onclick="openFeedbackModal(${interview.id}, true)">查看评价</button>`;
                }
                
                let feedbackText = interview.feedback_result ? `<span class="tag tag-blue">${interview.feedback_result}</span>` : '<span style="color:var(--text-secondary); font-size:13px;">待填写</span>';

                const dateObj = new Date(interview.start_time);
                const interviewDateObj = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
                
                // Formatted string
                const dateStr = dateObj.toLocaleDateString();
                const timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const cardHtml = `
                    <div class="interview-item">
                        <div class="interview-col" style="flex:1.2;">
                            <div class="interview-col-label">候选人姓名</div>
                            <div class="interview-col-value" style="font-weight:600;">${interview.candidate?.name || '未知'}</div>
                        </div>
                        <div class="interview-col" style="flex:1.5;">
                            <div class="interview-col-label">面试职位</div>
                            <div class="interview-col-value">${interview.job_title}</div>
                        </div>
                        <div class="interview-col" style="flex:1.5;">
                            <div class="interview-col-label">面试日期及时间</div>
                            <div class="interview-col-value">${dateStr} ${timeStr}</div>
                        </div>
                        <div class="interview-col" style="flex:1;">
                            <div class="interview-col-label">面试官</div>
                            <div class="interview-col-value">${interview.interviewer_name}</div>
                        </div>
                        <div class="interview-col" style="flex:1;">
                            <div class="interview-col-label">面试反馈</div>
                            <div>${feedbackText}</div>
                        </div>
                        <div class="interview-actions">
                            ${btnHtml}
                        </div>
                    </div>
                `;
                
                if (interviewDateObj.getTime() === todayDate.getTime()) {
                    listToday.innerHTML += cardHtml;
                    countToday++;
                } else if (interviewDateObj.getTime() > todayDate.getTime()) {
                    listFuture.innerHTML += cardHtml;
                    countFuture++;
                } else {
                    listPast.innerHTML += cardHtml;
                    countPast++;
                }
            });
            
            if (countToday === 0) listToday.innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border-color); border-radius:8px;">今日暂无面试安排</div>';
            if (countFuture === 0) listFuture.innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border-color); border-radius:8px;">暂无即将到来的面试</div>';
            if (countPast === 0) listPast.innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border-color); border-radius:8px;">暂无历史面试</div>';
        }

        let isReadOnlyFeedback = false;

        async function openFeedbackModal(id, isReadOnly=false) {
            document.getElementById('feedbackInterviewId').value = id;
            isReadOnlyFeedback = isReadOnly;
            
            const interview = allInterviews.find(i => i.id === id);
            
            if (isReadOnly) {
                document.getElementById('feedbackResult').value = interview.feedback_result || '待定';
                document.getElementById('feedbackText').value = interview.feedback_text || '';
                document.getElementById('feedbackResult').disabled = true;
                document.getElementById('feedbackText').disabled = true;
                document.getElementById('btnSubmitFeedback').style.display = 'none';
            } else {
                document.getElementById('feedbackResult').disabled = false;
                document.getElementById('feedbackText').disabled = false;
                document.getElementById('btnSubmitFeedback').style.display = 'flex';
                
                // Fetch template if new
                try {
                    const tpls = await fetch('/api/settings/feedback-templates').then(r=>r.json());
                    if (tpls && tpls.length > 0) {
                        document.getElementById('feedbackText').value = tpls[0].content;
                    }
                } catch(e) {}
            }
            
            document.getElementById('feedbackModal').classList.add('active');
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.remove('active');
        }

        async function submitFeedback() {
            const id = document.getElementById('feedbackInterviewId').value;
            const result = document.getElementById('feedbackResult').value;
            const text = document.getElementById('feedbackText').value;
            
            try {
                const response = await fetch(`/api/interviews/${id}/feedback`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ feedback_result: result, feedback_text: text })
                });
                
                if (response.ok) {
                    if (window.showToast) showToast('评价提交成功', 'success');
                    closeFeedbackModal();
                    loadInterviews();
                } else {
                    if (window.showToast) showToast('提交失败', 'error');
                }
            } catch(e) {
                if (window.showToast) showToast('网络异常', 'error');
            }
        }
    </script>
</body>
</html>
