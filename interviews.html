<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试安排 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=17">
    <style>
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            margin-top: 32px;
            color: var(--text-primary);
        }
        .section-title:first-child {
            margin-top: 0;
        }
        .interview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .interview-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: var(--transition);
        }
        .interview-item:hover {
            box-shadow: var(--shadow-sm);
            border-color: #d0d0d5;
        }
        .interview-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .interview-col-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .interview-col-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .interview-actions {
            display: flex;
            gap: 8px;
            min-width: 100px;
            justify-content: flex-end;
        }
        @media (max-width: 768px) {
            .interview-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .interview-actions {
                width: 100%;
                justify-content: stretch;
            }
            .interview-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="padding-top:20px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                    <h1 class="page-title" style="margin:0;">面试安排</h1>
                </div>
                
                <div class="section-title">今天的面试</div>
                <div class="interview-list" id="list-today"></div>

                <div class="section-title">明天及之后的面试</div>
                <div class="interview-list" id="list-future"></div>

                <div class="section-title">之前的面试</div>
                <div class="interview-list" id="list-past"></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-card" style="width: 520px; padding: 32px 40px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.15);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <h2 style="margin:0; font-size:20px; font-weight:600;">填写面试评价</h2>
                <div id="feedbackCandidateInfo" style="font-size:13px; color:var(--text-secondary); background:var(--bg-color); padding:6px 12px; border-radius:20px; font-weight:500;">--</div>
            </div>
            
            <input type="hidden" id="feedbackInterviewId">
            <input type="hidden" id="feedbackResult" value="满意">
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label style="font-weight:600; margin-bottom:12px; display:block; font-size:14px;">综合面试结论 <span class="required-mark">*</span></label>
                <div class="segmented-control" id="feedbackSegmentedControl" style="padding: 4px; background: #F5F5F7; border-radius: 12px;">
                    <div class="segmented-item active" data-value="满意" style="border-radius: 8px;">
                        <span style="display:block; font-size:14px; margin-bottom:4px; font-weight:600;">满意</span>
                        <span style="font-size:11px; font-weight:normal; opacity:0.7;">建议推进</span>
                    </div>
                    <div class="segmented-item" data-value="待定" style="border-radius: 8px;">
                        <span style="display:block; font-size:14px; margin-bottom:4px; font-weight:600;">待定</span>
                        <span style="font-size:11px; font-weight:normal; opacity:0.7;">保留观望</span>
                    </div>
                    <div class="segmented-item" data-value="不满意" style="border-radius: 8px;">
                        <span style="display:block; font-size:14px; margin-bottom:4px; font-weight:600;">不满意</span>
                        <span style="font-size:11px; font-weight:normal; opacity:0.7;">建议淘汰</span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label style="font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; font-size:14px;">
                    详细评价记录
                    <span style="font-weight:500; font-size:12px; color:var(--primary-color); cursor:pointer; background:#e8f4fd; padding:4px 10px; border-radius:12px;" onclick="loadFeedbackTemplate()" id="btnLoadTemplate">加载模板</span>
                </label>
                <textarea id="feedbackText" class="form-control" style="height:180px; font-family:inherit; resize:vertical; padding:16px; border-radius:12px; line-height:1.5; font-size:14px; border:1px solid var(--border-color);" placeholder="请输入面试反馈..."></textarea>
            </div>
            <div style="display:flex; gap:16px; margin-top:32px;">
                <button class="btn" style="flex:1; justify-content:center; padding:12px; border-radius:8px; font-weight:500;" onclick="closeFeedbackModal()">取消</button>
                <button class="btn btn-primary" id="btnSubmitFeedback" style="flex:1; justify-content:center; padding:12px; border-radius:8px; font-weight:500;" onclick="submitFeedback()">提交最终评价</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js?v=11"></script>
    <script>
        let allInterviews = [];

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('interviews');
            renderHeader();
            loadInterviews();
        });

        async function loadInterviews() {
            try {
                const response = await fetch('/api/interviews');
                allInterviews = await response.json();
                renderList();
            } catch(e) { console.error(e); }
        }

        function renderList() {
            const listToday = document.getElementById('list-today');
            const listFuture = document.getElementById('list-future');
            const listPast = document.getElementById('list-past');
            
            listToday.innerHTML = '';
            listFuture.innerHTML = '';
            listPast.innerHTML = '';
            
            // Normalize current time to start of day for comparison
            const now = new Date();
            const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            // Sort interviews by date ascending
            allInterviews.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));
            
            let countToday = 0, countFuture = 0, countPast = 0;

            allInterviews.forEach(interview => {
                let btnHtml = '';

                if (interview.status === '已安排') {
                    btnHtml = `<button class="btn btn-primary" style="padding:6px 16px; font-size:13px;" onclick="openFeedbackModal(${interview.id})">填写评价</button>`;
                } else if (interview.status === '已完成') {
                    btnHtml = `<button class="btn" style="padding:6px 16px; font-size:13px;" onclick="openFeedbackModal(${interview.id}, true)">查看评价</button>`;
                }
                
                let feedbackText = interview.feedback_result ? `<span class="tag tag-blue">${interview.feedback_result}</span>` : '<span style="color:var(--text-secondary); font-size:13px;">待填写</span>';

                const dateObj = new Date(interview.start_time);
                const interviewDateObj = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
                
                // Formatted string
                const dateStr = dateObj.toLocaleDateString();
                const timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const cardHtml = `
                    <div class="interview-item">
                        <div class="interview-col" style="flex:1.2;">
                            <div class="interview-col-label">候选人姓名</div>
                            <div class="interview-col-value" style="font-weight:600;">${interview.candidate?.name || '未知'}</div>
                        </div>
                        <div class="interview-col" style="flex:1.5;">
                            <div class="interview-col-label">面试职位</div>
                            <div class="interview-col-value">${interview.job_title}</div>
                        </div>
                        <div class="interview-col" style="flex:1.5;">
                            <div class="interview-col-label">面试日期及时间</div>
                            <div class="interview-col-value">${dateStr} ${timeStr}</div>
                        </div>
                        <div class="interview-col" style="flex:1;">
                            <div class="interview-col-label">面试官</div>
                            <div class="interview-col-value">${interview.interviewer_name}</div>
                        </div>
                        <div class="interview-col" style="flex:1;">
                            <div class="interview-col-label">面试反馈</div>
                            <div>${feedbackText}</div>
                        </div>
                        <div class="interview-actions">
                            ${btnHtml}
                        </div>
                    </div>
                `;
                
                if (interviewDateObj.getTime() === todayDate.getTime()) {
                    listToday.innerHTML += cardHtml;
                    countToday++;
                } else if (interviewDateObj.getTime() > todayDate.getTime()) {
                    listFuture.innerHTML += cardHtml;
                    countFuture++;
                } else {
                    listPast.innerHTML += cardHtml;
                    countPast++;
                }
            });
            
            if (countToday === 0) listToday.innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border-color); border-radius:8px;">今日暂无面试安排</div>';
            if (countFuture === 0) listFuture.innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border-color); border-radius:8px;">暂无即将到来的面试</div>';
            if (countPast === 0) listPast.innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border-color); border-radius:8px;">暂无历史面试</div>';
        }

        let isReadOnlyFeedback = false;

        document.querySelectorAll('#feedbackSegmentedControl .segmented-item').forEach(item => {
            item.addEventListener('click', () => {
                if (isReadOnlyFeedback) return;
                document.querySelectorAll('#feedbackSegmentedControl .segmented-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                document.getElementById('feedbackResult').value = item.dataset.value;
            });
        });

        async function openFeedbackModal(id, isReadOnly=false) {
            document.getElementById('feedbackInterviewId').value = id;
            isReadOnlyFeedback = isReadOnly;
            
            const interview = allInterviews.find(i => i.id === id);
            
            if (interview && interview.candidate) {
                document.getElementById('feedbackCandidateInfo').innerText = `${interview.candidate.name} · ${interview.job_title}`;
            } else {
                document.getElementById('feedbackCandidateInfo').innerText = interview ? interview.job_title : '--';
            }
            
            const resultVal = interview.feedback_result || '满意';
            document.getElementById('feedbackResult').value = resultVal;
            
            // Sync Segmented Control UI
            document.querySelectorAll('#feedbackSegmentedControl .segmented-item').forEach(i => {
                i.classList.remove('active');
                if (i.dataset.value === resultVal) {
                    i.classList.add('active');
                }
            });
            
            if (isReadOnly) {
                document.getElementById('feedbackText').value = interview.feedback_text || '暂无评价内容';
                document.getElementById('feedbackText').disabled = true;
                document.getElementById('btnSubmitFeedback').style.display = 'none';
                document.getElementById('btnLoadTemplate').style.display = 'none';
                document.querySelector('#feedbackModal h2').innerText = '面试评价记录';
            } else {
                document.getElementById('feedbackText').disabled = false;
                document.getElementById('btnSubmitFeedback').style.display = 'flex';
                document.getElementById('btnLoadTemplate').style.display = 'inline-block';
                document.querySelector('#feedbackModal h2').innerText = '填写面试评价';
                
                // Fetch template if new
                try {
                    const tpls = await fetch('/api/settings/feedback-templates').then(r=>r.json());
                    if (tpls && tpls.length > 0) {
                        document.getElementById('feedbackText').value = tpls[0].content;
                    }
                } catch(e) {}
            }
            
            document.getElementById('feedbackModal').classList.add('active');
        }

        async function loadFeedbackTemplate() {
            try {
                const tpls = await fetch('/api/settings/feedback-templates').then(r=>r.json());
                if (tpls && tpls.length > 0) {
                    document.getElementById('feedbackText').value = tpls[0].content;
                    if(window.showToast) showToast('模板已加载', 'success');
                } else {
                    if(window.showToast) showToast('系统未配置评价模板', 'error');
                }
            } catch(e) {
                if(window.showToast) showToast('模板加载失败', 'error');
            }
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.remove('active');
        }

        async function submitFeedback() {
            const id = document.getElementById('feedbackInterviewId').value;
            const result = document.getElementById('feedbackResult').value;
            const text = document.getElementById('feedbackText').value;
            
            try {
                const response = await fetch(`/api/interviews/${id}/feedback`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ feedback_result: result, feedback_text: text })
                });
                
                if (response.ok) {
                    if (window.showToast) showToast('评价提交成功', 'success');
                    closeFeedbackModal();
                    loadInterviews();
                } else {
                    if (window.showToast) showToast('提交失败', 'error');
                }
            } catch(e) {
                if (window.showToast) showToast('网络异常', 'error');
            }
        }
    </script>
</body>
</html>
