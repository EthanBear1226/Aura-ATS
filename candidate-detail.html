<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人详情 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=14">
    <style>
        .detail-layout {
            display: flex;
            gap: 24px;
            height: calc(100vh - 130px);
        }
        .profile-pane {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        .content-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .avatar-lg {
            width: 80px; height: 80px; border-radius: 40px;
            background: var(--primary-color);
            color: white; font-size: 32px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex; border-bottom: 1px solid var(--border-color);
            padding: 0 16px; background: #fafafa;
        }
        .tab {
            padding: 16px 24px; cursor: pointer; color: var(--text-secondary);
            font-weight: 500; border-bottom: 2px solid transparent;
        }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { padding: 24px; overflow-y: auto; flex: 1; display: none; }
        .tab-content.active { display: block; }
        
        .skill-tag {
            display: inline-block; padding: 4px 10px; background: #f0f0f0;
            border-radius: 16px; font-size: 13px; margin: 0 8px 8px 0; color: #333;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="padding-top: 16px;">
                <div style="margin-bottom:16px;">
                    <a href="candidates.html" style="color:var(--text-secondary); text-decoration:none; font-size:14px;">← 返回列表</a>
                </div>
                
                <div class="detail-layout">
                    <!-- Left Pane -->
                    <div class="profile-pane">
                        <div class="card" style="text-align:center; display:flex; flex-direction:column; align-items:center;">
                            <div class="avatar-lg" id="cand-avatar">U</div>
                            <h2 style="margin:0 0 8px 0;" id="cand-name">加载中</h2>
                            <div style="color:var(--text-secondary); font-size:14px; margin-bottom:16px;" id="cand-job">--</div>
                            <span class="tag tag-blue" style="margin-bottom:24px;" id="cand-stage">--</span>
                            
                            <div style="width:100%; display:flex; flex-direction:column; gap:8px;" id="cand-actions-container">
                                <button class="btn btn-primary" id="btn-next-stage" style="width:100%; justify-content:center;" onclick="moveToNextStage()">推进流程</button>
                                <div style="display:flex; gap:8px; width:100%;">
                                    <button class="btn" style="flex:1;" onclick="openScheduleDrawer(currentCandidate?.name || '', currentCandidate?.email || '', currentCandidate?.job || '', currentCandidate?.id)">安排面试</button>
                                    <button class="btn" style="flex:1; color:#FF3B30;" onclick="eliminateCurrentCandidate()">淘汰</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card">
                            <h3 style="font-size:16px; margin-top:0;">基本信息</h3>
                            <div style="font-size:14px; color:var(--text-secondary); line-height:2;">
                                <div id="cand-job-info">投递职位: --</div>
                                <div id="cand-exp">学历: --</div>
                                <div style="display: flex; align-items: center; gap: 8px;">电话: <span id="cand-phone" style="cursor: pointer; color: var(--primary-color);" onclick="copyText(this.innerText, '电话')">--</span></div>
                                <div style="display: flex; align-items: center; gap: 8px;">邮箱: <span id="cand-email" style="cursor: pointer; color: var(--primary-color);" onclick="copyText(this.innerText, '邮箱')">--</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Pane -->
                    <div class="content-pane">
                        <div class="tabs">
                            <div class="tab active" onclick="switchTab(0)">综合档案</div>
                            <div class="tab" onclick="switchTab(1)">招聘动态</div>
                        </div>
                        
                        <div class="tab-content active" id="tab-0">
                            <div id="match-score-container" style="display: none; background: #fffcf0; border: 1px solid #ffe58f; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
                                <h3 style="margin-top: 0; color: #faad14; display: flex; align-items: center; gap: 8px;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    AI 人岗匹配打分
                                    <span style="margin-left:auto; font-size:24px; font-weight:bold; color:#faad14;"><span id="match-score">--</span> <span style="font-size:14px; font-weight:normal;">分</span></span>
                                </h3>
                                <div id="match-reason" style="font-size: 14px; color: #333; line-height: 1.6; margin-top: 8px;">
                                    加载中...
                                </div>
                            </div>

                            <div style="background: #f4f8ff; border: 1px solid #d0e1ff; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
                                <h3 style="margin-top: 0; color: var(--primary-color); display: flex; align-items: center; gap: 8px;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                                    AI 简历概括
                                </h3>
                                <div id="ai-summary" style="font-size: 14px; color: #333; line-height: 1.6;">
                                    加载中...
                                </div>
                            </div>

                            <h3>💡 核心技能提取</h3>
                            <div id="ai-skills" style="margin-bottom: 24px;">
                                <span class="skill-tag">加载中...</span>
                            </div>

                            <h3>📊 AI 深度解析与建议</h3>
                            <div style="background: #fdfaf6; border: 1px solid #f2e6d9; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
                                <div id="ai-analysis" style="font-size: 14px; color: #555; line-height: 1.6;">
                                    加载中...
                                </div>
                            </div>

                            <h3>📄 原始简历预览</h3>
                            <div style="height: 600px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 24px;">
                                <iframe id="pdf-viewer" style="width:100%; height:100%; border:none;" src=""></iframe>
                            </div>
                        </div>
                        
                        <div class="tab-content" id="tab-1">
                            <div style="padding-left:16px; border-left:2px solid var(--border-color);" id="timeline-container">
                                <!-- Timeline generated by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Recommend Modal -->
    <div class="modal-overlay" id="recommendModal">
        <div class="modal-card">
            <h2 style="margin-top:0;">推荐给用人部门</h2>
            <div style="margin-bottom: 16px;">
                <label style="font-size:14px; font-weight:500; display:block; margin-bottom:8px;">选择用人经理</label>
                <select id="recommend-manager-select" style="width:100%; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border-color); outline:none;">
                    <option value="研发总监 (Manager_Tech)">研发总监 (Manager_Tech)</option>
                    <option value="产品总监 (Manager_Product)">产品总监 (Manager_Product)</option>
                    <option value="设计总监 (Manager_Design)">设计总监 (Manager_Design)</option>
                </select>
            </div>
            <div style="margin-bottom: 24px;">
                <label style="font-size:14px; font-weight:500; display:block; margin-bottom:8px;">推荐评语 (可选)</label>
                <textarea id="recommend-comment" rows="3" style="width:100%; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border-color); outline:none; resize:none; box-sizing:border-box;" placeholder="例如：该候选人技术栈匹配，建议重点关注..."></textarea>
            </div>
            <div style="text-align:right;">
                <button class="btn" onclick="closeRecommendModal()" style="margin-right:8px;">取消</button>
                <button class="btn btn-primary" onclick="submitRecommend()">确认推送</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js?v=9"></script>
    <script>
        const STAGES = ['初筛', '用人部门筛选', '面试', '沟通offer', '待入职', '已入职'];
        let currentCandidate = null;

        function copyText(text, type) {
            if (!text || text === '--' || text === '暂无') return;
            navigator.clipboard.writeText(text).then(() => {
                if (window.showToast) showToast(`${type}已复制`, 'success');
                else alert(`${type}已复制`);
            }).catch(err => {
                console.error('Copy failed', err);
            });
        }

        function openRecommendModal(id) {
            document.getElementById('recommendModal').classList.add('active');
        }
        function closeRecommendModal() {
            document.getElementById('recommendModal').classList.remove('active');
            document.getElementById('recommend-comment').value = '';
        }
        async function submitRecommend() {
            if (!currentCandidate) return;
            const manager = document.getElementById('recommend-manager-select').value;
            const comment = document.getElementById('recommend-comment').value;
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const operatorName = user.name || '系统';
            
            const detailsStr = `推至: ${manager}${comment ? ', 评语: ' + comment : ''}`;
            
            try {
                const response = await fetch(`/api/candidates/${currentCandidate.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        stage: '用人部门筛选', 
                        operator: operatorName,
                        details: detailsStr
                    })
                });
                
                if(response.ok) {
                    alert('已成功推荐给用人部门！');
                    closeRecommendModal();
                    loadDetail();
                } else {
                    const data = await response.json();
                    alert(`操作失败: ${data.detail || '未知错误'}`);
                }
            } catch (error) {
                console.error(error);
                alert('网络错误，请检查后端服务。');
            }
        }

        async function loadDictionariesForDetail() {
            try {
                const interviewers = await fetch('/api/settings/interviewers').then(r=>r.json());
                const managers = interviewers.filter(i => i.role_type === 'Manager');
                
                const recSelect = document.getElementById('recommend-manager-select');
                if (recSelect) {
                    recSelect.innerHTML = managers.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
                }
                
                // 如果存在抽屉相关的选项
                const drawSelect = document.getElementById('drawerInterviewerSelect');
                if (drawSelect) {
                    drawSelect.innerHTML = '<option value="" disabled selected>请选择面试官</option>' + interviewers.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
                }
            } catch(e) { console.error('Failed to load dicts', e); }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('candidates');
            renderHeader();
            loadDictionariesForDetail();
            loadDetail();
        });

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((tc, i) => {
                tc.classList.toggle('active', i === index);
            });
        }

        async function loadDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) return;

            try {
                const response = await fetch(`/api/candidates/${id}`);
                if (!response.ok) throw new Error("Candidate not found");
                
                const candidate = await response.json();
                currentCandidate = candidate;
                
                document.getElementById('cand-name').innerText = candidate.name;
                document.getElementById('cand-avatar').innerText = candidate.name.charAt(0) || 'U';
                document.getElementById('cand-job').innerText = candidate.job;
                document.getElementById('cand-job-info').innerText = `投递职位: ${candidate.job}`;
                document.getElementById('cand-stage').innerText = candidate.stage;
                document.getElementById('cand-exp').innerText = `学历: ${candidate.exp}`;
                document.getElementById('cand-phone').innerText = candidate.phone || '暂无';
                document.getElementById('cand-email').innerText = candidate.email || '暂无';
                
                // Update Actions Container
                const actionsContainer = document.getElementById('cand-actions-container');
                if (candidate.stage === '已淘汰') {
                    // 只读模式 / 人才库模式
                    actionsContainer.innerHTML = `
                        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="reactivateCurrentCandidate()">重新激活并移入工作台</button>
                    `;
                } else {
                    // 正常活跃模式
                    const currentIndex = STAGES.indexOf(candidate.stage);
                    let nextBtnHtml = '';
                    if (currentIndex >= 0 && currentIndex < STAGES.length - 1) {
                        const nextStage = STAGES[currentIndex + 1];
                        if (nextStage === '用人部门筛选') {
                            nextBtnHtml = `<button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="openRecommendModal(${candidate.id})">推荐给用人部门</button>`;
                        } else {
                            nextBtnHtml = `<button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="moveToNextStage()">推进至「${nextStage}」</button>`;
                        }
                    }
                    
                    actionsContainer.innerHTML = `
                        ${nextBtnHtml}
                        <div style="display:flex; gap:8px; width:100%; margin-top:8px;">
                            <button class="btn" style="flex:1;" onclick="openScheduleDrawer('${candidate.name}', '${candidate.email || ''}', '${candidate.job}', ${candidate.id})">安排面试</button>
                            <button class="btn" style="flex:1; color:#FF3B30;" onclick="eliminateCurrentCandidate()">淘汰</button>
                        </div>
                    `;
                }
                
                // Render Timeline Logs
                const timelineContainer = document.getElementById('timeline-container');
                if (candidate.logs && candidate.logs.length > 0) {
                    let html = '';
                    candidate.logs.forEach((log, index) => {
                        const isLatest = index === 0;
                        const dateStr = new Date(log.created_at).toLocaleString();
                        html += `
                            <div style="margin-bottom:24px; position:relative;">
                                <div style="position:absolute; left:-23px; top:2px; width:10px; height:10px; border-radius:5px; background: ${isLatest ? 'var(--primary-color)' : '#D1D1D6'};"></div>
                                <div style="font-weight: ${isLatest ? '600' : '500'}; color: ${isLatest ? 'var(--text-primary)' : 'var(--text-secondary)'};">${log.action}</div>
                                <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">${dateStr} · 操作人: ${log.operator}</div>
                                ${log.details ? `<div style="font-size:13px; margin-top:8px; background:var(--bg-color); padding:8px 12px; border-radius:4px; color:var(--text-primary); border: 1px solid var(--border-color);">${log.details}</div>` : ''}
                            </div>
                        `;
                    });
                    if(timelineContainer) timelineContainer.innerHTML = html;
                } else if(timelineContainer) {
                    timelineContainer.innerHTML = '<div style="color:var(--text-secondary); font-size:13px;">暂无动态流转记录</div>';
                }

                // Skills
                if(candidate.skills && candidate.skills.length > 0) {
                    document.getElementById('ai-skills').innerHTML = candidate.skills.map(s => `<span class="skill-tag tag-blue">${s}</span>`).join('');
                } else {
                    document.getElementById('ai-skills').innerHTML = '<span class="skill-tag">暂无提取到的技能</span>';
                }

                // AI Summary & Analysis
                document.getElementById('ai-summary').innerText = candidate.ai_summary || "暂无 AI 概括数据。";
                document.getElementById('ai-analysis').innerHTML = candidate.ai_analysis || "暂无 AI 深度分析数据。";

                // Match Score
                if (candidate.match_score !== null && candidate.match_score !== undefined) {
                    document.getElementById('match-score-container').style.display = 'block';
                    document.getElementById('match-score').innerText = candidate.match_score;
                    document.getElementById('match-reason').innerText = candidate.match_reason || "暂无匹配维度点评。";
                    
                    // Update color based on score
                    const score = candidate.match_score;
                    const scoreSpan = document.getElementById('match-score').parentElement;
                    const titleH3 = document.getElementById('match-score-container').querySelector('h3');
                    
                    if (score >= 80) {
                        scoreSpan.style.color = '#52c41a';
                        titleH3.style.color = '#52c41a';
                        document.getElementById('match-score-container').style.borderColor = '#b7eb8f';
                        document.getElementById('match-score-container').style.background = '#f6ffed';
                    } else if (score >= 60) {
                        scoreSpan.style.color = '#faad14';
                        titleH3.style.color = '#faad14';
                        document.getElementById('match-score-container').style.borderColor = '#ffe58f';
                        document.getElementById('match-score-container').style.background = '#fffbe6';
                    } else {
                        scoreSpan.style.color = '#ff4d4f';
                        titleH3.style.color = '#ff4d4f';
                        document.getElementById('match-score-container').style.borderColor = '#ffa39e';
                        document.getElementById('match-score-container').style.background = '#fff1f0';
                    }
                }

                // PDF Viewer
                if (candidate.pdf_path) {
                    // Prepend backend URL so it works when frontend is opened directly
                    document.getElementById('pdf-viewer').src = `${candidate.pdf_path}`;
                } else {
                    document.getElementById('pdf-viewer').srcdoc = "<div style='padding:20px;font-family:sans-serif'>暂无附件</div>";
                }

            } catch (e) {
                console.warn("Backend API unavailable. Using mock data for Netlify demo.", e);
                const mockCandidates = {
                    "1": { 
                        name: "林慕风", job: "资深 AI 算法专家", stage: "面试中", exp: "8年 / 硕士", phone: "138-1234-5678", email: "linmufeng@example.com",
                        skills: ["PyTorch", "大模型微调", "Python", "分布式训练", "NLP"], 
                        ai_summary: "候选人拥有8年以上的AI算法开发与落地经验，学术与工程能力双优。曾主导过亿级用户系统的推荐架构重构，具备多模态大模型的微调实战经验，是团队技术攻坚的绝佳人选。",
                        ai_analysis: "✅ 亮点：<br>1. 具备亿级高并发系统的工程落地经验，这在AI算法工程师中非常稀缺。<br>2. 有顶会论文发表，证明其对前沿算法有持续跟进和研究能力。<br>⚠️ 风险：<br>暂未体现带队管理经验，可能更偏向技术专家（IC）路线，如果该岗位需要大量团队管理工作，需在面试中着重考察。<br>🎯 面试建议：重点考察大模型微调的实际业务收益，以及其负责模块在整体架构中的比重。",
                        raw_text: "【个人总结】\n拥有8年AI算法实战经验，曾主导亿级用户的核心推荐系统重构，精通多模态大模型的微调和部署。\n擅长使用PyTorch和C++，极强的工程落地能力，曾在顶会发表过两篇学术论文。", 
                        created_at: new Date().toISOString() 
                    },
                    "2": { 
                        name: "苏婉清", job: "全栈开发工程师", stage: "初筛通过", exp: "3年 / 本科", phone: "135-2345-6789", email: "suwanqing@example.com",
                        skills: ["Vue3", "React", "Node.js", "FastAPI", "MySQL", "AWS"], 
                        ai_summary: "候选人具备3年开发经验，技能栈全面，涵盖现代主流前后端框架（Vue3/React + Node.js/FastAPI）。有独立负责中型商业项目（跨境电商）全生命周期的实战经验，业务落地能力强。",
                        ai_analysis: "✅ 亮点：<br>1. 能够独立完成全栈项目开发与 AWS 云端部署，具备独立作战能力。<br>2. 代码规范意识较强，适合快速迭代的敏捷团队。<br>⚠️ 风险：<br>工作年限仅3年，且多为独立负责项目，可能在大规模团队协作、复杂系统架构设计方面的经验略显不足。<br>🎯 面试建议：考察其面对高并发、复杂状态管理时的解决方案，以及对系统性能优化的思考。",
                        raw_text: "【专业技能】\n熟悉前后端开发流程，熟练使用 Vue3 和 React 构建响应式前端，后端熟悉 Python(FastAPI) 和 Node.js。\n曾独立负责中型跨境电商平台的全栈开发与云端部署，代码规范严谨。", 
                        created_at: new Date().toISOString() 
                    },
                    "3": { 
                        name: "陈浩宇", job: "B端高级产品经理", stage: "初筛", exp: "5年 / 硕士", phone: "139-3456-7890", email: "chenhaoyu@example.com",

        async function moveToNextStage() {
            if (!currentCandidate) return;
            const currentIndex = STAGES.indexOf(currentCandidate.stage);
            if (currentIndex >= 0 && currentIndex < STAGES.length - 1) {
                const nextStage = STAGES[currentIndex + 1];
                showConfirm(`确定要将该候选人推进到【${nextStage}】节点吗？`, async () => {
                    const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
                    const operatorName = user.name || '系统';
                    
                    try {
                        const response = await fetch(`/api/candidates/${currentCandidate.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stage: nextStage, operator: operatorName })
                        });
                        
                        if(response.ok) {
                            showToast('已成功推进！', 'success');
                            loadDetail(); // Reload to refresh UI
                        } else {
                            showToast('推进失败，请检查服务。', 'error');
                        }
                    } catch(error) {
                        console.error(error);
                        showToast('网络错误', 'error');
                    }
                });
            }
        }

        async function eliminateCurrentCandidate() {
            if(!currentCandidate) return;
            showConfirm('确定要淘汰该候选人并归档到人才库吗？', async () => {
                try {
                    const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
                    const operatorName = user.name || '系统';
                    
                    const response = await fetch(`/api/candidates/${currentCandidate.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stage: '已淘汰', operator: operatorName, details: '淘汰至人才库' })
                    });
                    
                    if(response.ok) {
                        showToast('已淘汰并归档', 'success');
                        setTimeout(() => {
                            window.location.href = 'candidates.html';
                        }, 1000);
                    } else {
                        const data = await response.json();
                        showToast(`操作失败: ${data.detail || '未知错误'}`, 'error');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('操作失败，请检查网络或后端服务', 'error');
                }
            });
        }

        async function reactivateCurrentCandidate() {
            if(!currentCandidate) return;
            showConfirm('确定要重新激活该候选人吗？TA 将回到初筛节点并移入工作台。', async () => {
                try {
                    const user = JSON.parse(localStorage.getItem('aura_user') || '{}');

                    }
                } catch (error) {
                    console.error(error);
                    showToast('操作失败，请检查网络', 'error');
                }
            });
        }
