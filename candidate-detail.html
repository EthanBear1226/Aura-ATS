<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人详情 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .detail-layout {
            display: flex;
            gap: 24px;
            height: calc(100vh - 130px);
        }
        .profile-pane {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        .content-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .avatar-lg {
            width: 80px; height: 80px; border-radius: 40px;
            background: var(--primary-color);
            color: white; font-size: 32px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex; border-bottom: 1px solid var(--border-color);
            padding: 0 16px; background: #fafafa;
        }
        .tab {
            padding: 16px 24px; cursor: pointer; color: var(--text-secondary);
            font-weight: 500; border-bottom: 2px solid transparent;
        }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { padding: 24px; overflow-y: auto; flex: 1; display: none; }
        .tab-content.active { display: block; }
        
        .skill-tag {
            display: inline-block; padding: 4px 10px; background: #f0f0f0;
            border-radius: 16px; font-size: 13px; margin: 0 8px 8px 0; color: #333;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content" style="padding-top: 16px;">
                <div style="margin-bottom:16px;">
                    <a href="candidates.html" style="color:var(--text-secondary); text-decoration:none; font-size:14px;">← 返回列表</a>
                </div>
                
                <div class="detail-layout">
                    <!-- Left Pane -->
                    <div class="profile-pane">
                        <div class="card" style="text-align:center; display:flex; flex-direction:column; align-items:center;">
                            <div class="avatar-lg" id="cand-avatar">U</div>
                            <h2 style="margin:0 0 8px 0;" id="cand-name">加载中</h2>
                            <div style="color:var(--text-secondary); font-size:14px; margin-bottom:16px;" id="cand-job">--</div>
                            <span class="tag tag-blue" style="margin-bottom:24px;" id="cand-stage">--</span>
                            
                            <div style="width:100%; display:flex; gap:8px;">
                                <button class="btn btn-primary" style="flex:1;">安排面试</button>
                                <button class="btn" style="flex:1; color:#FF3B30;">淘汰</button>
                            </div>
                        </div>
                        
                        <div class="card">
                            <h3 style="font-size:16px; margin-top:0;">基本信息</h3>
                            <div style="font-size:14px; color:var(--text-secondary); line-height:2;">
                                <div id="cand-exp">经验: --</div>
                                <div>电话: 138-xxxx-xxxx</div>
                                <div>邮箱: candidate@example.com</div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Pane -->
                    <div class="content-pane">
                        <div class="tabs">
                            <div class="tab active" onclick="switchTab(0)">在线简历 (AI解析)</div>
                            <div class="tab" onclick="switchTab(1)">招聘动态</div>
                            <div class="tab" onclick="switchTab(2)">附件预览</div>
                        </div>
                        
                        <div class="tab-content active" id="tab-0">
                            <h3>核心技能</h3>
                            <div id="ai-skills">
                                <span class="skill-tag">加载中...</span>
                            </div>
                            <h3>简历原文参考</h3>
                            <div id="ai-experience" style="font-size:14px; color:var(--text-secondary); white-space: pre-wrap;">
                                --
                            </div>
                        </div>
                        
                        <div class="tab-content" id="tab-1">
                            <div style="padding-left:16px; border-left:2px solid var(--border-color);">
                                <div style="margin-bottom:24px; position:relative;">
                                    <div style="position:absolute; left:-23px; top:2px; width:10px; height:10px; border-radius:5px; background:var(--primary-color);"></div>
                                    <div style="font-weight:500;">入库成功</div>
                                    <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;" id="timeline-date">刚刚 · 系统自动处理</div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-content" id="tab-2" style="padding:0;">
                            <iframe id="pdf-viewer" style="width:100%; height:100%; border:none;" src=""></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('candidates');
            renderHeader();
            loadDetail();
        });

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((tc, i) => {
                tc.classList.toggle('active', i === index);
            });
        }

        async function loadDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) return;

            try {
                const response = await fetch(`http://localhost:8001/api/candidates/${id}`);
                if (!response.ok) throw new Error("Candidate not found");
                
                const candidate = await response.json();
                
                document.getElementById('cand-name').innerText = candidate.name;
                document.getElementById('cand-avatar').innerText = candidate.name.charAt(0) || 'U';
                document.getElementById('cand-job').innerText = candidate.job;
                document.getElementById('cand-stage').innerText = candidate.stage;
                document.getElementById('cand-exp').innerText = `经验: ${candidate.exp}`;
                
                let dateStr = candidate.created_at ? new Date(candidate.created_at).toLocaleString() : '刚刚';
                document.getElementById('timeline-date').innerText = `${dateStr} · 系统自动处理`;

                // Skills
                if(candidate.skills && candidate.skills.length > 0) {
                    document.getElementById('ai-skills').innerHTML = candidate.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
                } else {
                    document.getElementById('ai-skills').innerHTML = '<span class="skill-tag">暂无提取到的技能</span>';
                }

                // Raw Text
                if(candidate.raw_text) {
                    document.getElementById('ai-experience').innerText = candidate.raw_text.substring(0, 1500) + '... (节选)';
                }

                // PDF Viewer
                if (candidate.pdf_path) {
                    // Prepend backend URL so it works when frontend is opened directly
                    document.getElementById('pdf-viewer').src = `http://localhost:8001${candidate.pdf_path}`;
                } else {
                    document.getElementById('pdf-viewer').srcdoc = "<div style='padding:20px;font-family:sans-serif'>暂无附件</div>";
                }

            } catch (e) {
                console.warn("Backend API unavailable. Using mock data for Netlify demo.", e);
                const mockCandidates = {
                    "1": { name: "林慕风", job: "资深 AI 算法专家", stage: "面试中", exp: "8年 / 硕士", skills: ["PyTorch", "大模型微调", "Python", "分布式训练", "NLP"], raw_text: "【个人总结】\n拥有8年AI算法实战经验，曾主导亿级用户的核心推荐系统重构，精通多模态大模型的微调和部署。\n擅长使用PyTorch和C++，极强的工程落地能力，曾在顶会发表过两篇学术论文。", created_at: new Date().toISOString() },
                    "2": { name: "苏婉清", job: "全栈开发工程师", stage: "初筛通过", exp: "3年 / 本科", skills: ["Vue3", "React", "Node.js", "FastAPI", "MySQL", "AWS"], raw_text: "【专业技能】\n熟悉前后端开发流程，熟练使用 Vue3 和 React 构建响应式前端，后端熟悉 Python(FastAPI) 和 Node.js。\n曾独立负责中型跨境电商平台的全栈开发与云端部署，代码规范严谨。", created_at: new Date().toISOString() },
                    "3": { name: "陈浩宇", job: "B端高级产品经理", stage: "新投递", exp: "5年 / 硕士", skills: ["Axure", "SaaS架构", "数据分析", "敏捷开发", "跨部门协作"], raw_text: "【工作经历】\n5年B端SaaS产品设计经验，负责过年入千万级SaaS系统从0到1的商业孵化。\n具有敏锐的市场洞察力和极强的数据追踪分析能力，能高效串联业务与研发线并驱动敏捷落地。", created_at: new Date().toISOString() },
                    "4": { name: "李晓彤", job: "HR 数据分析师", stage: "新投递", exp: "1年 / 本科", skills: ["Python", "SQL", "Tableau", "Excel高级", "数据可视化"], raw_text: "【项目经验】\n拥有1年大厂人力资源部门数据分析实习经验，熟练使用SQL和Python进行底层数据清理及分析。\n独立运用 Tableau 制作员工绩效及流失率可视化看板，多次为管理层提供数据支撑的汇报。", created_at: new Date().toISOString() }
                };
                
                const candidate = mockCandidates[id] || mockCandidates["1"];
                
                document.getElementById('cand-name').innerText = candidate.name;
                document.getElementById('cand-avatar').innerText = candidate.name.charAt(0) || 'U';
                document.getElementById('cand-job').innerText = candidate.job;
                document.getElementById('cand-stage').innerText = candidate.stage;
                document.getElementById('cand-exp').innerText = `经验: ${candidate.exp}`;

                let dateStr = candidate.created_at ? new Date(candidate.created_at).toLocaleString() : '刚刚';
                document.getElementById('timeline-date').innerText = `${dateStr} · 系统自动处理`;

                // Skills
                if(candidate.skills && candidate.skills.length > 0) {
                    const skillsDiv = document.getElementById('cand-skills');
                    skillsDiv.innerHTML = '';
                    candidate.skills.forEach(s => {
                        skillsDiv.innerHTML += `<span class="tag tag-blue">${s}</span>`;
                    });
                }

                // Raw Text
                document.getElementById('cand-raw').innerText = candidate.raw_text || '暂无内容';
                
                // PDF Viewer Fallback
                document.getElementById('pdf-viewer').srcdoc = "<div style='padding:20px;font-family:sans-serif;text-align:center;'><h4>演示模式 (脱机状态)</h4><p>当前运行在静态演示模式，无法加载本地 PDF 附件。</p></div>";
            }
        }
    </script>
</body>
</html>
