<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人才库 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=14">
    <style>
        .candidates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .table-container {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th, .table-container td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .table-container th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            background-color: var(--bg-color);
        }
        .table-container tr:hover td {
            background-color: #F9FAFB;
        }
        .job-tab {
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .job-tab:hover {
            background: var(--bg-color);
        }
        .job-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(10, 132, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        
        <!-- Secondary Job Sidebar -->
        <aside class="secondary-sidebar" id="job-sidebar">
            <div class="secondary-sidebar-header">人才库筛选</div>
            <div class="job-list-menu" id="job-filters">
                <!-- Filters will be generated here by JS -->
            </div>
        </aside>

        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content">
                <div class="candidates-header">
                    <h1 class="page-title" style="margin:0;">人才库</h1>
                    <div style="color:var(--text-secondary); font-size:14px;">这里沉淀了所有被淘汰的候选人，您可以随时将其“重新激活”并捞回工作台。</div>
                </div>
                
                <div class="card" style="padding: 0; overflow: hidden; margin-top: 24px;">
                    <table class="table-container" id="candidate-table">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>应聘职位</th>
                                <th>状态</th>
                                <th>学历</th>
                                <th>归档日期</th>
                                <th style="text-align:right;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="candidateTbody">
                            <!-- Data populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=9"></script>
    <script>
        // Global State
        let allCandidates = [];
        let currentFilter = '全部职位';
        
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('talent-pool');
            renderHeader();
            loadCandidates();
        });

        async function loadCandidates() {
            try {
                const response = await fetch('/api/candidates');
                if(!response.ok) throw new Error("Failed to fetch");
                const data = await response.json();
                
                // 仅显示已淘汰的候选人
                allCandidates = data.filter(c => c.stage === '已淘汰');
                
                renderJobFilters();
                renderTable();
            } catch (error) {
                console.warn("Backend API unavailable.", error);
                document.getElementById('candidateTbody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red; padding:40px;">获取数据失败，请确保后端服务运行。</td></tr>';
            }
        }

        function renderJobFilters() {
            let jobsSet = new Set();
            allCandidates.forEach(c => jobsSet.add(c.job));
            let availableJobs = Array.from(jobsSet);
            
            const filterContainer = document.getElementById('job-filters');
            let html = `<div class="job-list-item ${currentFilter === '全部职位' ? 'active' : ''}" onclick="setFilter('全部职位')">全部归档人才</div>`;
            
            availableJobs.forEach(job => {
                html += `<div class="job-list-item ${currentFilter === job ? 'active' : ''}" onclick="setFilter('${job}')">${job}</div>`;
            });
            
            filterContainer.innerHTML = html;
        }
        
        function setFilter(job) {
            currentFilter = job;
            renderTable();
            renderJobFilters();
        }

        function renderTable() {
            const tbody = document.getElementById('candidateTbody');
            tbody.innerHTML = '';
            
            let displayData = allCandidates;
            if (currentFilter !== '全部职位') {
                displayData = displayData.filter(c => c.job === currentFilter);
            }
            
            if (displayData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-secondary); padding: 60px;">人才库暂无匹配人才</td></tr>';
                return;
            }

            displayData.forEach(c => {
                let dateStr = c.updated_at ? new Date(c.updated_at).toISOString().split('T')[0] : '--';
                
                tbody.innerHTML += `
                    <tr onclick="viewDetail('${c.id}')" style="cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f4f8ff'" onmouseout="this.style.backgroundColor=''">
                        <td style="font-weight:500;">${c.name}</td>
                        <td>${c.job}</td>
                        <td><span class="tag tag-gray">${c.stage}</span></td>
                        <td style="color:var(--text-secondary);">${c.exp}</td>
                        <td style="color:var(--text-secondary);">${dateStr}</td>
                        <td style="text-align:right; white-space: nowrap;">
                            <button class="btn btn-primary" onclick="event.stopPropagation(); reactivateCandidate('${c.id}')" style="padding:6px 16px; font-size:12px; background: var(--primary-color); color: white; border: none; border-radius: 4px;">重新激活</button>
                            <button class="btn" onclick="event.stopPropagation(); hardDeleteCandidate('${c.id}')" style="padding:6px 16px; font-size:12px; color: #FF3B30; border-color: transparent; background: transparent; border-radius: 4px;">彻底删除</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function hardDeleteCandidate(id) {
            showConfirm('确定要彻底删除该候选人以及关联的简历附件吗？删除后将从数据库中永久抹除，无法恢复。', async () => {
                try {
                    const response = await fetch(`/api/candidates/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if(response.ok) {
                        showToast('已彻底删除', 'success');
                        loadCandidates(); // Refresh the list
                    } else {
                        const data = await response.json();
                        showToast(`删除失败: ${data.detail || '未知错误'}`, 'error');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('删除失败，请检查网络或后端服务', 'error');
                }
            });
        }

        async function reactivateCandidate(id) {
            showConfirm('确定要重新激活该候选人吗？TA 将回到工作台初筛流程。', async () => {
                try {
                    const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
                    const operatorName = user.name || '系统';
                    
                    const response = await fetch(`/api/candidates/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stage: '初筛', operator: operatorName, details: '从人才库重新激活' })
                    });
                    
                    if(response.ok) {
                        showToast('已重新激活，移入工作台', 'success');
                        loadCandidates();
                    } else {
                        const data = await response.json();
                        showToast(`操作失败: ${data.detail || '未知错误'}`, 'error');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('操作失败，请检查网络', 'error');
                }
            });
        }

        function viewDetail(id) {
            window.location.href = `candidate-detail.html?id=${id}`;
        }
    </script>
</body>
</html>
