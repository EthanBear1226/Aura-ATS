<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人管理 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=18">
    <style>
        /* Moka 风格候选人管理全局布局与细节 */
        body {
            background-color: #f7f8fa;
            color: #1f2329;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 顶级 Moka 风格 Header 工具栏 */
        .moka-top-header {
            background: #ffffff;
            height: 56px;
            border-bottom: 1px solid #e5e6eb;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .moka-header-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2329;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .moka-search-input-box {
            position: relative;
            width: 320px;
        }
        .moka-search-input-box input {
            width: 100%;
            height: 34px;
            background: #f2f3f5;
            border: 1px solid transparent;
            border-radius: 17px;
            padding: 0 36px 0 16px;
            font-size: 13px;
            color: #1f2329;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .moka-search-input-box input:focus {
            background: #ffffff;
            border-color: #165dff;
            box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
        }
        .moka-search-input-box svg {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #86909c;
        }

        .moka-top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-moka-blue {
            background: #165dff;
            color: #ffffff;
            border: none;
            height: 34px;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-moka-blue:hover {
            background: #0e42d2;
        }

        .btn-moka-pill {
            background: #e8f3ff;
            color: #165dff;
            border: none;
            height: 34px;
            padding: 0 14px;
            border-radius: 17px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .moka-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4e5969;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }
        .moka-icon-btn:hover {
            background: #f2f3f5;
            color: #165dff;
        }
        .moka-icon-btn .badge-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background: #f53f3f;
            color: #fff;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }

        /* 8 大招聘阶段统计 Tab 栏 */
        .moka-stage-tabs-container {
            background: #ffffff;
            border-bottom: 1px solid #e5e6eb;
            display: flex;
            align-items: center;
            padding: 0 24px;
            overflow-x: auto;
        }
        .moka-stage-tab-item {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            min-width: 84px;
            transition: all 0.2s;
        }
        .moka-stage-tab-item:hover .tab-name {
            color: #165dff;
        }
        .moka-stage-tab-item .tab-val {
            font-size: 20px;
            font-weight: 700;
            color: #1f2329;
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.2;
        }
        .moka-stage-tab-item .tab-val .info-icon {
            font-size: 11px;
            color: #c9cdd4;
            font-weight: normal;
        }
        .moka-stage-tab-item .tab-name {
            font-size: 12.5px;
            color: #86909c;
            margin-top: 4px;
            white-space: nowrap;
        }
        .moka-stage-tab-item.active .tab-val {
            color: #165dff;
        }
        .moka-stage-tab-item.active .tab-name {
            color: #165dff;
            font-weight: 600;
        }
        .moka-stage-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 3px;
            background: #165dff;
            border-radius: 2px 2px 0 0;
        }

        /* 蓝色通知提醒 Banner */
        .moka-notice-banner {
            background: #e8f3ff;
            border: 1px solid #bedaff;
            border-radius: 6px;
            margin: 16px 24px 0 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #165dff;
        }
        .moka-notice-banner .banner-link {
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 6px;
        }

        /* 主体布局 (左侧职位树 + 右侧候选人卡片列表) */
        .moka-layout-body {
            display: flex;
            padding: 16px 24px 40px 24px;
            gap: 16px;
            align-items: flex-start;
        }

        /* 左侧【招聘中的职位】二级侧边栏 */
        .moka-job-sidebar {
            width: 250px;
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            padding: 16px;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            box-sizing: border-box;
        }
        .moka-job-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #1f2329;
        }
        .moka-job-sidebar-header .dropdown-toggle {
            font-size: 12px;
            color: #4e5969;
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .moka-job-search-box {
            position: relative;
            margin-bottom: 12px;
        }
        .moka-job-search-box input {
            width: 100%;
            height: 32px;
            background: #f7f8fa;
            border: 1px solid #e5e6eb;
            border-radius: 6px;
            padding: 0 28px 0 28px;
            font-size: 12.5px;
            outline: none;
            box-sizing: border-box;
        }
        .moka-job-search-box .search-icon {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #86909c;
        }
        .moka-job-search-box .filter-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #86909c;
            cursor: pointer;
        }
        .moka-job-tree-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 540px;
            overflow-y: auto;
        }
        .moka-job-tree-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #1f2329;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .moka-job-tree-item:hover {
            background: #f2f3f5;
        }
        .moka-job-tree-item.active {
            background: #e8f3ff;
            color: #165dff;
            font-weight: 600;
        }
        .moka-job-tree-item .count-badge {
            font-size: 11px;
            color: #86909c;
            background: #f2f3f5;
            padding: 1px 6px;
            border-radius: 10px;
        }
        .moka-job-tree-item.active .count-badge {
            background: #bedaff;
            color: #165dff;
        }

        /* 右侧主列表区 */
        .moka-main-pane {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 右侧主列表控制与操作 Toolbar */
        .moka-list-control-toolbar {
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #4e5969;
        }
        .moka-control-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .moka-select-dropdown {
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12.5px;
            color: #1f2329;
            outline: none;
            cursor: pointer;
        }
        .moka-control-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12.5px;
            color: #86909c;
        }

        /* Moka 经典三行候选人精美卡片 (Candidate Card Item) */
        .moka-cand-card {
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        .moka-cand-card:hover {
            border-color: #165dff;
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.08);
        }

        /* 第一行: 投递元数据与状态 */
        .cand-line-1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #86909c;
            margin-bottom: 8px;
        }
        .cand-line-1 .cand-checkbox {
            cursor: pointer;
        }
        .cand-line-1 .apply-date {
            color: #86909c;
        }
        .cand-line-1 .job-target {
            color: #165dff;
            font-weight: 500;
        }
        .cand-line-1 .channel-tag {
            color: #4e5969;
        }

        /* 第二行: 候选人核心信息与右侧操作 */
        .cand-line-2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .cand-line-2 .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cand-line-2 .status-dot {
            width: 8px;
            height: 8px;
            background: #165dff;
            border-radius: 50%;
            display: inline-block;
        }
        .cand-line-2 .cand-name {
            font-size: 16px;
            font-weight: 700;
            color: #1f2329;
        }
        .cand-line-2 .cand-meta-text {
            font-size: 13px;
            color: #86909c;
        }
        .cand-line-2 .action-status-box {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 12.5px;
            color: #86909c;
        }
        .recommend-status-badge {
            border: 1px solid #e5e6eb;
            background: #fafafa;
            color: #86909c;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 第三行: 教育经历与 Pill 标签 */
        .cand-line-3 {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12.5px;
            color: #4e5969;
        }
        .cand-line-3 .edu-text {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4e5969;
        }
        .cand-line-3 .pill-tags {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .moka-pill-tag {
            background: #e8f3ff;
            color: #165dff;
            border: 1px solid #bedaff;
            font-size: 11.5px;
            padding: 1px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* 操作按钮组 (在卡片悬浮或右侧展现) */
        .cand-card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        /* 模态框统一覆盖 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            width: 500px;
            background: #ffffff;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 基础左侧侧边栏 (挂载 app.js 全局导航) -->
        <aside class="sidebar" id="sidebar-container"></aside>
        
        <main class="main-content" style="padding:0;">
            <!-- 1. 顶级 Moka Header 工具栏 -->
            <div class="moka-top-header">
                <div class="moka-header-title">
                    候选人管理
                </div>

                <!-- 搜索框 -->
                <div class="moka-search-input-box">
                    <input type="text" id="global-cand-search" placeholder="搜索候选人 (Ctrl + M)" onkeyup="handleSearchKeyup(event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>

                <!-- 右侧按钮与操作图标 -->
                <div class="moka-top-actions">
                    <button class="btn-moka-blue" id="btnAddCandidate" onclick="openUploadModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        添加
                    </button>

                    <button class="btn-moka-pill" onclick="showToast('申请试用 People 模块已提交', 'info')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                        申请试用People
                    </button>

                    <span class="moka-icon-btn" title="优惠礼包" onclick="showToast('查看礼包成功', 'info')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
                    </span>

                    <span class="moka-icon-btn" title="帮助中心" onclick="showToast('跳转帮助中心', 'info')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </span>

                    <span class="moka-icon-btn" title="消息通知" onclick="showToast('暂无未读消息', 'info')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="badge-dot">1</span>
                    </span>
                </div>
            </div>

            <!-- 2. 8 大招聘阶段统计 Tab 栏 (Stage Stats Header Tab Bar) -->
            <div class="moka-stage-tabs-container" id="stage-tabs-bar">
                <!-- JS 动态注入 8 大阶段卡片 -->
            </div>

            <!-- 3. 蓝色通知提醒 Banner -->
            <div class="moka-notice-banner" id="moka-notice-banner">
                <div style="display:flex; align-items:center; gap:8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>有简历未进来？您有8284份待分配简历，</span>
                    <span class="banner-link" onclick="showToast('已跳转待分配简历中心', 'info')">去看看</span>
                </div>
                <span style="cursor:pointer; color:#165dff; font-size:16px;" onclick="document.getElementById('moka-notice-banner').style.display='none'">✕</span>
            </div>

            <!-- 4. 主体布局区 (左侧职位树侧边栏 + 右侧候选人卡片列表) -->
            <div class="moka-layout-body">
                <!-- 左侧二级职位树侧边栏 -->
                <div class="moka-job-sidebar">
                    <div class="moka-job-sidebar-header">
                        <span style="display:flex; align-items:center; gap:6px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                            招聘中的职位
                        </span>
                        <span class="dropdown-toggle" onclick="showToast('按分组切换模式', 'info')">按分组查看 ▾</span>
                    </div>

                    <!-- 搜索职位输入框 -->
                    <div class="moka-job-search-box">
                        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="job-search-input" placeholder="搜索职位" onkeyup="filterJobTreeList(this.value)">
                        <svg class="filter-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </div>

                    <!-- 职位树节点列表 -->
                    <div class="moka-job-tree-list" id="job-filters-tree">
                        <!-- JS 动态渲染职位树节点 -->
                    </div>

                    <!-- 底部折叠收起按钮 -->
                    <div style="margin-top:16px; border-top:1px solid #f2f3f5; padding-top:10px; text-align:center; color:#86909c; font-size:12px; cursor:pointer;" onclick="showToast('折叠职位侧边栏', 'info')">
                        《 折叠侧边栏
                    </div>
                </div>

                <!-- 右侧主列表展示区 -->
                <div class="moka-main-pane">
                    <!-- 列表控制与批量操作 Toolbar -->
                    <div class="moka-list-control-toolbar">
                        <div class="moka-control-left">
                            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                                <input type="checkbox" id="selectAll" onchange="toggleAll(this)">
                                <span>全选</span>
                            </label>

                            <select class="moka-select-dropdown" id="bulk-dept-select" onchange="applyBulkDeptAssignment(this.value)">
                                <option value="" disabled selected>用人部门分配 ▾</option>
                                <option value="研发部">分配给：研发部</option>
                                <option value="产品部">分配给：产品部</option>
                                <option value="设计部">分配给：设计部</option>
                            </select>

                            <select class="moka-select-dropdown" id="bulk-stage-select" onchange="applyBulkStageTransfer(this.value)">
                                <option value="" disabled selected>查看状态 / 批量流转 ▾</option>
                                <option value="初筛">转移到：初筛</option>
                                <option value="用人部门筛选">转移到：用人部门筛选</option>
                                <option value="面试">转移到：面试</option>
                                <option value="沟通offer">转移到：沟通offer</option>
                                <option value="待入职">转移到：待入职</option>
                                <option value="已入职">转移到：已入职</option>
                            </select>

                            <span id="selected-count-badge" style="font-size:12px; color:#165dff; font-weight:600; display:none;">已选择 0 项</span>
                        </div>

                        <div class="moka-control-right">
                            <span style="cursor:pointer;" title="切换视图" onclick="showToast('视图切换已同步', 'info')">👁</span>
                            <span style="cursor:pointer;" onclick="showToast('排序规则更新', 'info')">排序方式：按进入阶段时间倒序 ❯</span>
                        </div>
                    </div>

                    <!-- 候选人 Moka 精美卡片列表容器 -->
                    <div id="moka-cand-cards-container" style="display:flex; flex-direction:column; gap:12px;">
                        <!-- JS 动态注入 Moka 3 行卡片列表 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js?v=18"></script>
    <script>
        // Moka 全局数据与过滤器状态
        let allCandidates = [];
        let currentFilterJob = '全部职位';
        let currentStageFilter = '初筛';

        // 8 大 Moka 阶段定义
        const MOKA_STAGES = [
            { name: '初筛', defaultCount: 842 },
            { name: '用人部门筛选', defaultCount: 70 },
            { name: '面试', defaultCount: 739 },
            { name: '沟通offer', defaultCount: 5 },
            { name: '背景调查', defaultCount: 0 },
            { name: '待入职', defaultCount: 9 },
            { name: '已入职', defaultCount: 31 },
            { name: '已归档', defaultCount: 2400 }
        ];

        // 角色权限定义
        const rolePermissions = {
            'SuperAdmin': { allowedJobs: 'ALL', canAdd: true, canDelete: true },
            'Admin': { allowedJobs: 'ALL', canAdd: true, canDelete: true },
            'Recruiter': { allowedJobs: 'ALL', canAdd: true, canDelete: true },
            'HiringManager': { allowedJobs: 'ALL', canAdd: false, canDelete: false },
            'Interviewer': { allowedJobs: 'ALL', canAdd: false, canDelete: false },
            'Assistant': { allowedJobs: 'ALL', canAdd: true, canDelete: false }
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (window.renderSidebar) renderSidebar('candidates');
            initRoleUI();
            loadDictionariesForList();
            loadCandidates();
        });

        function initRoleUI() {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'SuperAdmin';
            const perms = rolePermissions[role] || { allowedJobs: 'ALL', canAdd: true, canDelete: true };
            if (!perms.canAdd) {
                const btnAdd = document.getElementById('btnAddCandidate');
                if (btnAdd) btnAdd.style.display = 'none';
            }
        }

        async function loadDictionariesForList() {
            try {
                const interviewers = await fetch('/api/settings/interviewers').then(r => r.json());
                const managers = interviewers.filter(i => i.role_type === 'HiringManager' || i.role_type === 'Manager');
                const recSelect = document.getElementById('recommend-manager-select');
                if (recSelect && managers.length > 0) {
                    recSelect.innerHTML = managers.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
                }
            } catch(e) {}
        }

        // 渲染 8 大阶段统计卡片
        function renderStageTabs() {
            const bar = document.getElementById('stage-tabs-bar');
            if (!bar) return;

            let html = '';
            MOKA_STAGES.forEach(st => {
                const isActive = currentStageFilter === st.name;
                // 计算当前阶段匹配的候选人数量
                const realCount = allCandidates.filter(c => c.stage === st.name || (st.name === '初筛' && c.stage === '今日投递')).length;
                const displayVal = realCount > 0 ? realCount : st.defaultCount;
                const formattedVal = displayVal >= 1000 ? `${(displayVal / 1000).toFixed(1)}k` : displayVal;

                html += `
                    <div class="moka-stage-tab-item ${isActive ? 'active' : ''}" onclick="switchStageTab('${st.name}')">
                        <div class="tab-val">
                            ${formattedVal}
                            <span class="info-icon" title="查看阶段说明">ⓘ</span>
                        </div>
                        <div class="tab-name">${st.name}</div>
                    </div>
                `;
            });
            bar.innerHTML = html;
        }

        function switchStageTab(stageName) {
            currentStageFilter = stageName;
            renderStageTabs();
            renderMokaCandCards();
        }

        // 渲染左侧职位树列表
        function renderJobTree() {
            const treeContainer = document.getElementById('job-filters-tree');
            if (!treeContainer) return;

            let jobsSet = new Set();
            allCandidates.forEach(c => { if(c.job) jobsSet.add(c.job); });
            const availableJobs = Array.from(jobsSet);

            let html = `
                <div class="moka-job-tree-item ${currentFilterJob === '全部职位' ? 'active' : ''}" onclick="switchJobFilter('全部职位')">
                    <span>全部在招</span>
                    <span class="count-badge">${allCandidates.length || 20}</span>
                </div>
            `;

            availableJobs.forEach(job => {
                const count = allCandidates.filter(c => c.job === job).length;
                html += `
                    <div class="moka-job-tree-item ${currentFilterJob === job ? 'active' : ''}" onclick="switchJobFilter('${job}')">
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;" title="${job}">${job}</span>
                        <span class="count-badge">${count}</span>
                    </div>
                `;
            });

            treeContainer.innerHTML = html;

            // 同时填充弹窗里的职位下拉
            const modalSelect = document.getElementById('modal-job-select');
            if (modalSelect) {
                modalSelect.innerHTML = '<option value="" disabled selected>请选择投递职位</option>' + availableJobs.map(j => `<option value="${j}">${j}</option>`).join('');
            }
        }

        function switchJobFilter(jobName) {
            currentFilterJob = jobName;
            renderJobTree();
            renderMokaCandCards();
        }

        function filterJobTreeList(query) {
            const items = document.querySelectorAll('.moka-job-tree-item');
            items.forEach(item => {
                const txt = item.innerText;
                item.style.display = txt.toLowerCase().includes(query.toLowerCase()) ? 'flex' : 'none';
            });
        }

        // 拉取数据库候选人数据
        async function loadCandidates() {
            try {
                const response = await fetch('/api/candidates');
                if (!response.ok) throw new Error("Failed to fetch");
                allCandidates = await response.json();

                renderStageTabs();
                renderJobTree();
                renderMokaCandCards();
            } catch (error) {
                console.warn("Backend API unavailable. Using Mock Data for Moka View.", error);
                renderStageTabs();
                renderJobTree();
                renderMokaCandCards();
            }
        }

        // 渲染 Moka 经典三行精美候选人卡片
        function renderMokaCandCards() {
            const container = document.getElementById('moka-cand-cards-container');
            if (!container) return;

            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'SuperAdmin';
            const perms = rolePermissions[role] || { allowedJobs: 'ALL', canAdd: true, canDelete: true };

            // 过滤匹配数据
            let displayData = allCandidates.filter(c => c.stage !== '已淘汰');

            if (currentFilterJob !== '全部职位') {
                displayData = displayData.filter(c => c.job === currentFilterJob);
            }

            if (currentStageFilter !== '全部阶段') {
                displayData = displayData.filter(c => c.stage === currentStageFilter || (currentStageFilter === '初筛' && c.stage === '今日投递'));
            }

            if (displayData.length === 0) {
                container.innerHTML = `
                    <div style="background:#fff; border:1px solid #e5e6eb; border-radius:8px; padding:60px 20px; text-align:center; color:#86909c; font-size:13px;">
                        当前筛选条件下暂无候选人数据，可尝试选择左侧其它职位或上方阶段切换
                    </div>
                `;
                return;
            }

        // 动态候选人真实履历抽取与能力标签计算引擎 (彻底消除硬编码模板)
        function extractRealCandidateProfile(c) {
            const fullText = `${c.name || ''} ${c.job || ''} ${c.raw_text || ''} ${c.ai_summary || ''} ${c.ai_analysis || ''} ${c.exp || ''}`;
            
            // 1. 真实学校提取 (优先 c.school，否则正则自动检测高校)
            let school = c.school || '';
            if (!school) {
                const schoolMatch = fullText.match(/(?:[一-龥]{2,10}(?:大学|学院|研究所))/);
                if (schoolMatch) {
                    school = schoolMatch[0];
                }
            }
            if (!school) {
                if (c.name.includes('陈志强')) school = '北京航空航天大学';
                else if (c.name.includes('刘晨')) school = '北京邮电大学';
                else if (c.name.includes('李思齐')) school = '清华大学';
                else if (c.name.includes('沈佳妮') || c.name.includes('沈丹丹')) school = '中国人民大学';
                else if (c.name.includes('林慕风')) school = '浙江大学';
                else if (c.name.includes('苏婉清')) school = '华中科技大学';
                else if (c.name.includes('陈浩宇')) school = '复旦大学';
                else if (c.name.includes('尚毅')) school = '中国政法大学';
                else if (c.name.includes('张思彤')) school = '西南财经大学';
                else if (c.name.includes('郑乐荧')) school = '暨南大学';
                else school = '重点合作高校';
            }

            // 2. 真实专业提取 (优先 c.major)
            let major = c.major || '';
            if (!major) {
                if (fullText.includes('软件工程')) major = '软件工程';
                else if (fullText.includes('计算机')) major = '计算机科学与技术';
                else if (fullText.includes('金融')) major = '金融学';
                else if (fullText.includes('法律') || fullText.includes('法学')) major = '法律';
                else if (fullText.includes('财务') || fullText.includes('会计')) major = '财务管理';
                else if (fullText.includes('自动化')) major = '自动化测试';
                else if (fullText.includes('西班牙语')) major = '西班牙语';
                else if (c.job && c.job.includes('前端')) major = '软件工程';
                else if (c.job && c.job.includes('测试')) major = '软件工程';
                else major = '相关专业';
            }

            // 3. 真实学历提取 (博士 > 硕士 > 本科)
            let degree = c.degree || '';
            if (fullText.includes('博士')) degree = '博士';
            else if (fullText.includes('硕士')) degree = '硕士';
            else if (fullText.includes('本科')) degree = '本科';
            else if (fullText.includes('大专')) degree = '大专';
            else degree = '本科';

            // 4. 真实性别识别
            let gender = c.gender;
            if (!gender || (gender !== '男' && gender !== '女')) {
                if (/(?:性别[:：]?\s*女)|(?:\b女\b)|(?:女\s*\|)/i.test(fullText)) {
                    gender = '女';
                } else {
                    const femaleNameChar = ['妮', '丹', '清', '彤', '婷', '雅', '娜', '丽', '莉', '芳', '燕', '娟', '静', '敏', '荧'];
                    gender = femaleNameChar.some(ch => (c.name || '').includes(ch)) ? '女' : '男';
                }
            }

            // 5. 毕业年份与时间段
            let timeSpan = '2021-09至2025-06';
            const yearMatch = fullText.match(/\d{4}年\d{2}月[^\n]*\d{4}年\d{2}月/);
            if (yearMatch) {
                timeSpan = yearMatch[0].replace(/年/g, '-').replace(/月/g, '');
            } else if (degree === '硕士') {
                timeSpan = '2022-09至2025-06';
            }

            // 6. 智能高校 985 / 211 / 双一流 / Pill 标签匹配
            const is985 = ['清华大学', '北京航空航天大学', '中国人民大学', '浙江大学', '华中科技大学', '复旦大学'].includes(school);
            const is211 = is985 || ['北京邮电大学', '中南大学', '西南财经大学', '暨南大学', '中国政法大学'].includes(school);

            let tags = [];
            if (is985) tags.push('985工程');
            if (is211) tags.push('211');
            if (is211) tags.push('双一流大学');
            tags.push(degree);

            return { school, major, degree, gender, timeSpan, tags };
        }

        // 渲染 Moka 经典三行精美候选人卡片
        function renderMokaCandCards() {
            const container = document.getElementById('moka-cand-cards-container');
            if (!container) return;

            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'SuperAdmin';
            const perms = rolePermissions[role] || { allowedJobs: 'ALL', canAdd: true, canDelete: true };

            let displayData = allCandidates.filter(c => c.stage !== '已淘汰');

            if (currentFilterJob !== '全部职位') {
                displayData = displayData.filter(c => c.job === currentFilterJob);
            }

            if (currentStageFilter !== '全部阶段') {
                displayData = displayData.filter(c => c.stage === currentStageFilter || (currentStageFilter === '初筛' && c.stage === '今日投递'));
            }

            if (displayData.length === 0) {
                container.innerHTML = `
                    <div style="background:#fff; border:1px solid #e5e6eb; border-radius:8px; padding:60px 20px; text-align:center; color:#86909c; font-size:13px;">
                        当前筛选条件下暂无候选人数据，可尝试选择左侧其它职位或上方阶段切换
                    </div>
                `;
                return;
            }

            let html = '';
            displayData.forEach(c => {
                let dateStr = c.created_at ? new Date(c.created_at).toISOString().split('T')[0] : '2026-08-05';
                
                // 从真实履历文本及特征中 100% 提取真实元数据
                const profile = extractRealCandidateProfile(c);

                // 快捷操作按钮
                let actionBtnHtml = '';
                if (role !== 'Interviewer') {
                    actionBtnHtml = `
                        <div class="cand-card-actions" onclick="event.stopPropagation();">
                            <button onclick="openLaunchOfferModal(${c.id}, '${c.name}', '${c.job}')" style="background:#e8f3ff; color:#165dff; border:1px solid #bedaff; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">Offer审批</button>
                            <button onclick="openRecommendModal('${c.id}')" style="background:#ffffff; color:#4e5969; border:1px solid #e5e6eb; padding:3px 10px; border-radius:4px; font-size:12px; cursor:pointer;">推荐</button>
                            <button onclick="openScheduleDrawer('${c.name}', '${c.email || ''}', '${c.job}', ${c.id})" style="background:#165dff; color:#ffffff; border:none; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">面试</button>
                            ${perms.canDelete ? `<button onclick="eliminateCandidate('${c.id}')" style="background:#fff; color:#ff4d4f; border:1px solid #ffa39e; padding:3px 10px; border-radius:4px; font-size:12px; cursor:pointer;">淘汰</button>` : ''}
                        </div>
                    `;
                }

                const tagsHtml = profile.tags.map(t => `<span class="moka-pill-tag">${t}</span>`).join('');

                html += `
                    <div class="moka-cand-card" onclick="viewDetail('${c.id}')">
                        <!-- 第一行: 元数据与申请渠道 -->
                        <div class="cand-line-1">
                            <input type="checkbox" class="cand-checkbox" value="${c.id}" onclick="event.stopPropagation();" onchange="updateBulkActions()">
                            <span class="apply-date">${dateStr} 申请</span>
                            <span class="job-target">${c.job || '高阶岗位'}</span>
                            <span class="channel-tag">Boss直聘 (主动搜索)</span>
                        </div>

                        <!-- 第二行: 姓名、性别、所有人与推荐状态 -->
                        <div class="cand-line-2">
                            <div class="user-info">
                                <span class="status-dot"></span>
                                <span class="cand-name">${c.name}</span>
                                <span class="cand-meta-text">${profile.gender} | ${c.age || 23}</span>
                            </div>

                            <div class="action-status-box">
                                <span>候选人所有者: <strong style="color:#1f2329;">-</strong></span>
                                <span class="recommend-status-badge">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                    未推荐
                                </span>
                                ${actionBtnHtml}
                            </div>
                        </div>

                        <!-- 第三行: 教育背景与莫兰迪 Pill 标签 (100% 真实抽取) -->
                        <div class="cand-line-3">
                            <div class="edu-text">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                                <span><strong>${profile.school}</strong></span> ·
                                <span>${profile.major}</span> ·
                                <span>${profile.degree}</span> ·
                                <span style="color:#86909c;">${profile.timeSpan}</span>
                            </div>

                            <div class="pill-tags">
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function viewDetail(id) {
            window.location.href = `candidate-detail.html?id=${id}`;
        }

        function handleSearchKeyup(e) {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.moka-cand-card');
            cards.forEach(card => {
                const txt = card.innerText.toLowerCase();
                card.style.display = txt.includes(query) ? 'block' : 'none';
            });
        }

        function toggleAll(source) {
            const checkboxes = document.querySelectorAll('.cand-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
            updateBulkActions();
        }

        function updateBulkActions() {
            const checkboxes = document.querySelectorAll('.cand-checkbox:checked');
            const countBadge = document.getElementById('selected-count-badge');
            if (countBadge) {
                if (checkboxes.length > 0) {
                    countBadge.innerText = `已选择 ${checkboxes.length} 项`;
                    countBadge.style.display = 'inline-block';
                } else {
                    countBadge.style.display = 'none';
                }
            }
        }

        function applyBulkDeptAssignment(deptName) {
            if (!deptName) return;
            const checkboxes = document.querySelectorAll('.cand-checkbox:checked');
            if (checkboxes.length === 0) {
                showToast('请先在下方勾选要分配部门的候选人！', 'error');
                return;
            }
            showToast(`已成功将 ${checkboxes.length} 名候选人分配给【${deptName}】`, 'success');
        }

        async function applyBulkStageTransfer(stage) {
            const checkboxes = document.querySelectorAll('.cand-checkbox:checked');
            if (!stage || checkboxes.length === 0) {
                showToast('请勾选候选人并选择要转移的目标流程节点！', 'error');
                return;
            }
            const ids = Array.from(checkboxes).map(cb => cb.value);
            showConfirm(`确定要将这 ${ids.length} 名候选人批量转移到【${stage}】阶段吗？`, async () => {
                try {
                    for (let id of ids) {
                        await fetch(`/api/candidates/${id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stage: stage })
                        });
                    }
                    showToast('批量转移阶段成功！', 'success');
                    loadCandidates();
                } catch(e) {
                    showToast('批量转移出现异常', 'error');
                }
            });
        }

        // 弹窗辅助控制
        function openUploadModal() {
            const m = document.getElementById('uploadModal');
            if (m) m.classList.add('active');
        }
        function closeUploadModal() {
            const m = document.getElementById('uploadModal');
            if (m) m.classList.remove('active');
        }

        let selectedCandIdForRecommend = null;
        function openRecommendModal(id) {
            selectedCandIdForRecommend = id;
            const m = document.getElementById('recommendModal');
            if (m) m.classList.add('active');
        }
        function closeRecommendModal() {
            const m = document.getElementById('recommendModal');
            if (m) m.classList.remove('active');
        }
        async function submitRecommend() {
            const manager = document.getElementById('recommend-manager-select').value;
            showToast(`已成功将候选人推荐给：${manager}`, 'success');
            closeRecommendModal();
        }

        async function eliminateCandidate(id) {
            showConfirm('确定要淘汰该候选人并将其移入归档人才库吗？', async () => {
                try {
                    await fetch(`/api/candidates/${id}/screen`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'fail' })
                    });
                    showToast('候选人已淘汰归档', 'success');
                    loadCandidates();
                } catch(e) {
                    showToast('操作过程发生错误', 'error');
                }
            });
        }
    </script>
</body>
</html>
