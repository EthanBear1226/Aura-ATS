<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人管理 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .candidates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .table-container {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th, .table-container td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .table-container th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            background-color: var(--bg-color);
        }
        .table-container tr:hover td {
            background-color: #F9FAFB;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            width: 500px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: var(--transition);
        }
        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #F0F8FF;
        }
        #upload-progress {
            display: none;
            margin-top: 16px;
        }
        
        .job-tab {
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .job-tab:hover {
            background: var(--bg-color);
        }
        .job-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(10, 132, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        
        <!-- Secondary Job Sidebar -->
        <aside class="secondary-sidebar" id="job-sidebar">
            <div class="secondary-sidebar-header">职位分类</div>
            <div class="job-list-menu" id="job-filters">
                <!-- Filters will be generated here by JS -->
            </div>
        </aside>

        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content">
                <div class="candidates-header">
                    <h1 class="page-title" style="margin:0;">候选人管理</h1>
                    <button class="btn btn-primary" onclick="openModal()" id="btnAddCandidate">+ 添加候选人</button>
                </div>
                
                <!-- Stage Filters -->
                <div style="display:flex; gap: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color);" id="stage-filters">
                    <!-- Filters generated by JS -->
                </div>
                
                <div class="card" style="padding: 0; overflow: hidden;">
                    <table class="table-container" id="candidate-table">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>应聘职位</th>
                                <th>招聘阶段</th>
                                <th>经验/学历</th>
                                <th>上传时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <h2 style="margin-top:0;">添加候选人 (AI解析)</h2>
            
            <div style="margin-bottom: 16px;">
                <label style="font-size:14px; font-weight:500; display:block; margin-bottom:8px;">投递职位</label>
                <select id="modal-job-select" style="width:100%; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border-color); outline:none;">
                    <option value="默认（AI自动提取）">默认 (依赖简历原文)</option>
                    <option value="高级前端工程师">高级前端工程师</option>
                    <option value="资深 AI 算法专家">资深 AI 算法专家</option>
                    <option value="B端高级产品经理">B端高级产品经理</option>
                </select>
            </div>
            
            <p style="color:var(--text-secondary); font-size:14px;">支持拖拽或点击上传，Aura 将自动提取结构化数据并存入数据库。</p>
            
            <input type="file" id="resume-file" accept="application/pdf" style="display:none;">
            <div class="upload-area" onclick="document.getElementById('resume-file').click()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--primary-color)" style="opacity:0.8"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <div style="margin-top:16px; font-weight:500;">点击或拖拽 PDF 文件到此处</div>
            </div>

            <div id="upload-progress">
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
                    <span id="progress-text" style="color:var(--primary-color); font-weight:500;">正在解析中...</span>
                </div>
                <div style="width:100%; height:6px; background:#eee; border-radius:3px; overflow:hidden;">
                    <div id="progress-bar" style="width:0%; height:100%; background:var(--primary-color); transition:width 0.3s;"></div>
                </div>
            </div>

            <div style="text-align:right; margin-top:24px;">
                <button class="btn" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        // Global State for Data and Filters
        let allCandidates = [];
        let currentFilter = '全部职位';
        let currentStageFilter = '全部阶段';
        const STAGES = ['全部阶段', '新投递', '初筛', '用人部门筛选', '面试', '沟通offer', '待入职', '已入职'];
        
        // Define RBAC Rules (In a real app, this comes from backend JWT/Session)
        const rolePermissions = {
            'SuperAdmin': { allowedJobs: 'ALL', canAdd: true, canDelete: true },
            'Recruiter': { allowedJobs: 'ALL', canAdd: true, canDelete: true },
            'HiringManager': { allowedJobs: ['高级前端工程师', '资深 AI 算法专家', '全栈开发工程师', '数据分析师'], canAdd: false, canDelete: false },
            'Interviewer': { allowedJobs: ['高级前端工程师'], canAdd: false, canDelete: false },
            'Assistant': { allowedJobs: 'ALL', canAdd: true, canDelete: false }
        };

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('candidates');
            renderHeader();
            initRoleUI();
            loadCandidates();
        });
        
        function initRoleUI() {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'SuperAdmin';
            const perms = rolePermissions[role];
            
            // Hide/Show Add button based on permission
            if(!perms.canAdd) {
                document.getElementById('btnAddCandidate').style.display = 'none';
            }
        }

        function renderJobFilters() {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'SuperAdmin';
            const perms = rolePermissions[role];
            
            let jobsSet = new Set();
            
            // Extract unique jobs from current data
            allCandidates.forEach(c => jobsSet.add(c.job));
            let availableJobs = Array.from(jobsSet);
            
            // Filter jobs based on role
            if (perms.allowedJobs !== 'ALL') {
                availableJobs = availableJobs.filter(job => perms.allowedJobs.includes(job));
            }
            
            const filterContainer = document.getElementById('job-filters');
            let html = `<div class="job-list-item ${currentFilter === '全部职位' ? 'active' : ''}" onclick="setFilter('全部职位')">全部在招 (我的权限)</div>`;
            
            availableJobs.forEach(job => {
                html += `<div class="job-list-item ${currentFilter === job ? 'active' : ''}" onclick="setFilter('${job}')">${job}</div>`;
            });
            
            filterContainer.innerHTML = html;
        }
        
        function setFilter(job) {
            currentFilter = job;
            renderTable();
            renderJobFilters(); // update active state
        }
        
        function renderStageFilters() {
            const filterContainer = document.getElementById('stage-filters');
            let html = '';
            STAGES.forEach(stage => {
                const isActive = currentStageFilter === stage;
                html += `<div onclick="setStageFilter('${stage}')" style="cursor:pointer; font-size: 14px; font-weight: ${isActive ? '600' : '500'}; color: ${isActive ? 'var(--primary-color)' : 'var(--text-secondary)'}; position: relative; padding-bottom: 8px;">
                    ${stage}
                    ${isActive ? '<div style="position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--primary-color); border-radius:2px;"></div>' : ''}
                </div>`;
            });
            filterContainer.innerHTML = html;
        }

        function setStageFilter(stage) {
            currentStageFilter = stage;
            renderTable();
            renderStageFilters();
        }

        async function loadCandidates() {
            try {
                const response = await fetch('http://localhost:8000/api/candidates');
                if(!response.ok) throw new Error("Failed to fetch");
                allCandidates = await response.json();
                
                renderJobFilters();
                renderStageFilters();
                renderTable();
            } catch (error) {
                console.warn("Backend API unavailable.", error);
                document.querySelector('#candidate-table tbody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">获取数据失败，请确保后端服务运行。</td></tr>';
            }
        }
        
        function renderTable() {
            const user = JSON.parse(localStorage.getItem('aura_user') || '{}');
            const role = user.role || 'SuperAdmin';
            const perms = rolePermissions[role];
            
            const tbody = document.querySelector('#candidate-table tbody');
            tbody.innerHTML = '';
            
            // 1. Filter by Role Permissions
            let displayData = allCandidates;
            if (perms.allowedJobs !== 'ALL') {
                displayData = displayData.filter(c => perms.allowedJobs.includes(c.job));
            }
            
            // 2. Filter by Selected Tab
            if (currentFilter !== '全部职位') {
                displayData = displayData.filter(c => c.job === currentFilter);
            }
            
            // 3. Filter by Selected Stage
            if (currentStageFilter !== '全部阶段') {
                displayData = displayData.filter(c => c.stage === currentStageFilter);
            }
            
            if (displayData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-secondary); padding: 40px;">当前筛选条件下暂无候选人数据</td></tr>';
                return;
            }

            displayData.forEach(c => {
                let stageColor = c.stage === '面试中' ? 'tag-blue' : 'tag-green';
                let dateStr = c.created_at ? new Date(c.created_at).toISOString().split('T')[0] : '--';
                
                // Show delete button only if permission allows
                let deleteBtnHtml = perms.canDelete 
                    ? `<button class="btn" onclick="event.stopPropagation(); deleteCandidate('${c.id}')" style="padding:4px 12px; font-size:12px; color: #FF3B30; border-color: #FF3B30; background: #fff;">删除</button>`
                    : '';
                    
                tbody.innerHTML += `
                    <tr onclick="viewDetail('${c.id}')" style="cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f4f8ff'" onmouseout="this.style.backgroundColor=''">
                        <td style="font-weight:500;">${c.name}</td>
                        <td>${c.job}</td>
                        <td><span class="tag ${stageColor}">${c.stage}</span></td>
                        <td style="color:var(--text-secondary);">${c.exp}</td>
                        <td style="color:var(--text-secondary);">${dateStr}</td>
                        <td style="white-space: nowrap;">
                            <button class="btn" onclick="event.stopPropagation(); alert('已操作推荐。');" style="padding:4px 12px; font-size:12px; margin-right: 4px; background: #fff;">推荐</button>
                            <button class="btn btn-primary" onclick="event.stopPropagation(); alert('已操作面试。');" style="padding:4px 12px; font-size:12px; background: var(--primary-color); color: white; border: none; margin-right: 4px;">面试</button>
                            ${deleteBtnHtml}
                        </td>
                    </tr>
                `;
            });
        }

        function viewDetail(id) {
            window.location.href = `candidate-detail.html?id=${id}`;
        }

        async function deleteCandidate(id) {
            if(!confirm('确定要删除该候选人以及关联的简历附件吗？删除后无法恢复。')) return;
            
            try {
                const response = await fetch(`http://localhost:8000/api/candidates/${id}`, {
                    method: 'DELETE'
                });
                
                if(response.ok) {
                    alert('删除成功');
                    loadCandidates(); // Refresh the list
                } else {
                    const data = await response.json();
                    alert(`删除失败: ${data.detail || '未知错误'}`);
                }
            } catch (error) {
                console.error(error);
                alert('删除失败，请检查网络或后端服务');
            }
        }

        function openModal() { document.getElementById('uploadModal').classList.add('active'); }
        function closeModal() { 
            document.getElementById('uploadModal').classList.remove('active'); 
            document.getElementById('upload-progress').style.display = 'none';
            document.getElementById('progress-bar').style.width = '0%';
        }

        // Upload and API Logic
        document.getElementById('resume-file').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('upload-progress').style.display = 'block';
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            progressBar.style.width = '30%';
            progressText.innerText = '正在上传文件...';

            const formData = new FormData();
            formData.append("file", file);

            try {
                progressBar.style.width = '60%';
                progressText.innerText = 'AI 模型深度解析中... (需等待几秒)';
                
                const response = await fetch('http://localhost:8000/api/parse-resume', {
                    method: 'POST',
                    body: formData
                });
                
                if(!response.ok) {
                    throw new Error(`API 返回错误状态: ${response.status}`);
                }
                
                const result = await response.json();
                
                progressBar.style.width = '100%';
                progressText.innerText = '解析并入库完成！';

                setTimeout(() => {
                    closeModal();
                    // Reload list from Database
                    loadCandidates();
                    // Optionally jump to detail page:
                    // viewDetail(result.id);
                }, 1000);

            } catch (error) {
                console.error(error);
                alert("解析失败，请确保后端服务 (uvicorn) 正在运行。");
                progressBar.style.width = '0%';
                document.getElementById('upload-progress').style.display = 'none';
            }
            
            // Clear file input
            e.target.value = '';
        });
    </script>
</body>
</html>
