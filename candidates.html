<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人管理 | Aura</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .candidates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .table-container {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th, .table-container td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .table-container th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            background-color: var(--bg-color);
        }
        .table-container tr:hover td {
            background-color: #F9FAFB;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            width: 500px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: var(--transition);
        }
        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #F0F8FF;
        }
        #upload-progress {
            display: none;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="header" id="header-container"></header>
            <div class="page-content">
                <div class="candidates-header">
                    <h1 class="page-title" style="margin:0;">候选人管理</h1>
                    <button class="btn btn-primary" onclick="openModal()">+ 智能解析简历</button>
                </div>
                
                <div class="card" style="padding: 0; overflow: hidden;">
                    <table class="table-container" id="candidate-table">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>应聘职位</th>
                                <th>招聘阶段</th>
                                <th>经验/学历</th>
                                <th>上传时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <h2 style="margin-top:0;">上传简历 (PDF)</h2>
            <p style="color:var(--text-secondary); font-size:14px;">支持拖拽或点击上传，Aura 将自动提取结构化数据并存入数据库。</p>
            
            <input type="file" id="resume-file" accept="application/pdf" style="display:none;">
            <div class="upload-area" onclick="document.getElementById('resume-file').click()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--primary-color)" style="opacity:0.8"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <div style="margin-top:16px; font-weight:500;">点击或拖拽 PDF 文件到此处</div>
            </div>

            <div id="upload-progress">
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
                    <span id="progress-text" style="color:var(--primary-color); font-weight:500;">正在解析中...</span>
                </div>
                <div style="width:100%; height:6px; background:#eee; border-radius:3px; overflow:hidden;">
                    <div id="progress-bar" style="width:0%; height:100%; background:var(--primary-color); transition:width 0.3s;"></div>
                </div>
            </div>

            <div style="text-align:right; margin-top:24px;">
                <button class="btn" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar('candidates');
            renderHeader();
            loadCandidates();
        });

        async function loadCandidates() {
            try {
                const response = await fetch('http://localhost:8001/api/candidates');
                const candidates = await response.json();
                const tbody = document.querySelector('#candidate-table tbody');
                tbody.innerHTML = '';
                
                if (candidates.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-secondary);">暂无候选人数据，请上传简历解析</td></tr>';
                    return;
                }

                candidates.forEach(c => {
                    let stageColor = c.stage === '面试中' ? 'tag-blue' : 'tag-green';
                    let dateStr = c.created_at ? new Date(c.created_at).toISOString().split('T')[0] : '--';
                    tbody.innerHTML += `
                        <tr onclick="viewDetail('${c.id}')" style="cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f4f8ff'" onmouseout="this.style.backgroundColor=''">
                            <td style="font-weight:500;">${c.name}</td>
                            <td>${c.job}</td>
                            <td><span class="tag ${stageColor}">${c.stage}</span></td>
                            <td style="color:var(--text-secondary);">${c.exp}</td>
                            <td style="color:var(--text-secondary);">${dateStr}</td>
                            <td style="white-space: nowrap;">
                                <button class="btn" onclick="event.stopPropagation(); alert('已通知用人部门主管进行评估。');" style="padding:4px 12px; font-size:12px; margin-right: 4px; background: #fff;">推荐</button>
                                <button class="btn btn-primary" onclick="event.stopPropagation(); alert('已向候选人发送面试邀约邮件。');" style="padding:4px 12px; font-size:12px; background: var(--primary-color); color: white; border: none;">面试</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.warn("Backend API unavailable. Using mock data for Netlify demo.", error);
                const candidates = [
                    { id: 1, name: "林慕风", job: "资深 AI 算法专家", stage: "面试中", exp: "8年 / 硕士", created_at: new Date().toISOString() },
                    { id: 2, name: "苏婉清", job: "全栈开发工程师", stage: "初筛通过", exp: "3年 / 本科", created_at: new Date().toISOString() },
                    { id: 3, name: "陈浩宇", job: "B端高级产品经理", stage: "新投递", exp: "5年 / 硕士", created_at: new Date().toISOString() },
                    { id: 4, name: "李晓彤", job: "HR 数据分析师", stage: "新投递", exp: "1年 / 本科", created_at: new Date().toISOString() }
                ];
                const tbody = document.querySelector('#candidate-table tbody');
                tbody.innerHTML = '';
                candidates.forEach(c => {
                    let stageColor = c.stage === '面试中' ? 'tag-blue' : 'tag-green';
                    let dateStr = c.created_at ? new Date(c.created_at).toISOString().split('T')[0] : '--';
                    tbody.innerHTML += `
                        <tr onclick="viewDetail('${c.id}')" style="cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f4f8ff'" onmouseout="this.style.backgroundColor=''">
                            <td style="font-weight:500;">${c.name}</td>
                            <td>${c.job}</td>
                            <td><span class="tag ${stageColor}">${c.stage}</span></td>
                            <td style="color:var(--text-secondary);">${c.exp}</td>
                            <td style="color:var(--text-secondary);">${dateStr}</td>
                            <td style="white-space: nowrap;">
                                <button class="btn" onclick="event.stopPropagation(); alert('已通知用人部门主管进行评估。');" style="padding:4px 12px; font-size:12px; margin-right: 4px; background: #fff;">推荐</button>
                                <button class="btn btn-primary" onclick="event.stopPropagation(); alert('已向候选人发送面试邀约邮件。');" style="padding:4px 12px; font-size:12px; background: var(--primary-color); color: white; border: none;">面试</button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        function viewDetail(id) {
            window.location.href = `candidate-detail.html?id=${id}`;
        }

        function openModal() { document.getElementById('uploadModal').classList.add('active'); }
        function closeModal() { 
            document.getElementById('uploadModal').classList.remove('active'); 
            document.getElementById('upload-progress').style.display = 'none';
            document.getElementById('progress-bar').style.width = '0%';
        }

        // Upload and API Logic
        document.getElementById('resume-file').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('upload-progress').style.display = 'block';
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            progressBar.style.width = '30%';
            progressText.innerText = '正在上传文件...';

            const formData = new FormData();
            formData.append("file", file);

            try {
                progressBar.style.width = '60%';
                progressText.innerText = 'AI 模型深度解析中... (需等待几秒)';
                
                const response = await fetch('http://localhost:8001/api/parse-resume', {
                    method: 'POST',
                    body: formData
                });
                
                if(!response.ok) {
                    throw new Error(`API 返回错误状态: ${response.status}`);
                }
                
                const result = await response.json();
                
                progressBar.style.width = '100%';
                progressText.innerText = '解析并入库完成！';

                setTimeout(() => {
                    closeModal();
                    // Reload list from Database
                    loadCandidates();
                    // Optionally jump to detail page:
                    // viewDetail(result.id);
                }, 1000);

            } catch (error) {
                console.error(error);
                alert("解析失败，请确保后端服务 (uvicorn) 正在运行。");
                progressBar.style.width = '0%';
                document.getElementById('upload-progress').style.display = 'none';
            }
            
            // Clear file input
            e.target.value = '';
        });
    </script>
</body>
</html>
